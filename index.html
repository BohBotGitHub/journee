<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyDayBot</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
 <nav id="nav">
  <div class="brand" data-act="home" role="link" tabindex="0" title="Accueil : aujourd’hui"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#e8590c"/><path d="M7 21a9 9 0 0 1 18 0" fill="#fff"/><rect x="5" y="22.5" width="22" height="2.4" rx="1.2" fill="#fff"/></svg>MyDayBot</div>
  <button class="navsearch" data-act="palopen" title="Rechercher ou lancer une commande (⌘K)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Rechercher</span><kbd>⌘K</kbd></button>
  <button data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="ll">Aujourd'hui</span><span class="sl">Jour</span></button>
  <button data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg><span class="ll">Semaine</span><span class="sl">Semaine</span></button>
  <button data-view="dump"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.4 2 4.5.6.8 1 1.6 1 2.5h6c0-.9.4-1.7 1-2.5.8-1.1 2-2.3 2-4.5a6 6 0 0 0-6-6z"/><path d="M9 20h6"/></svg><span class="ll">Vide-tête</span><span class="sl">Idées</span></button>
  <button data-view="backlog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="ll">Backlog</span><span class="sl">Backlog</span></button>
  <button data-view="review"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span class="ll">Revue</span><span class="sl">Revue</span></button>
  <button data-view="settings" class="navset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span class="ll">Réglages</span><span class="sl">Réglages</span></button>
  <button data-view="side" id="sidebtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/></svg><span class="ll">Agenda</span><span class="sl">Plus</span></button>
  <div id="runchip"></div>
  <button id="tip" class="tip" data-act="keys" title="Voir tous les raccourcis (touche ?)"></button>
 </nav>
 <div id="syncbar" class="hidden" role="status"></div>
 <main id="main"></main>
 <aside id="side">
  <div class="stabs"><button data-side="cal">Agenda</button><button data-side="todo">To Do</button><button data-side="ai">Claude<span id="aibadge"></span></button><button class="sm ghost mset" data-act="go" data-v="settings">Réglages</button><button class="x closeside" data-act="closeside" aria-label="Fermer le panneau">×</button></div>
  <div id="sidebody"></div>
 </aside>
</div>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="focus" class="focus hidden"></div>
<div id="toast" role="status"></div>

<script src="js/core.js"></script>
<script src="js/tree.js"></script>
<script src="js/google.js"></script>
<script src="js/flow.js"></script>
<script src="js/sync.js"></script>
<script src="js/microsoft.js"></script>
<script src="js/auth.js"></script>
<script src="js/ai.js"></script>
<script src="js/import.js"></script>
<script src="js/views.js"></script>
<script src="js/render.js"></script>
<script src="js/events.js"></script>
<script src="js/main.js"></script>
</body>
</html>
