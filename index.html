<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journée</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calme, posé, un carnet du matin — peu de couleurs, beaucoup d'air
   IDEA: un agenda papier ouvert : la liste du jour à gauche, la page horaire à droite
   PICTURE: la liste de tâches et la colonne horaire sont l'image elle-même
   COLOUR and TYPE: papier blanc chaud, encre presque noire, un orange lever-de-soleil ; Figtree
   LAYOUT: navigation fine | liste du jour | agenda ; empilé sur mobile */
:root{color-scheme:light dark;
--bg:light-dark(#faf8f5,#141619);--panel:light-dark(#ffffff,#1c1f24);--panel2:light-dark(#f3f0eb,#22262c);
--line:light-dark(#e8e3dc,#2d3239);--ink:light-dark(#1c1e22,#eceae6);--mute:light-dark(#6a6e77,#9aa0a9);
--acc:#e8590c;--acc2:light-dark(#fff0e6,#3a2416);--ok:#2f9e6a;--warn:#d6336c;--ev:light-dark(#e9edf3,#2a3038);--evi:light-dark(#3d4a5c,#c3ccd8);
--sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;min-height:38px}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.06)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.danger{background:transparent;color:var(--warn);border-color:transparent}
button.sm{padding:4px 10px;min-height:30px;font-size:13px;border-radius:7px}
button.big{min-height:48px;padding:10px 20px;font-size:16px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:40px;font-size:16px;width:100%}
textarea{resize:vertical;line-height:1.5}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
.hidden{display:none!important}
.sp{flex:1}
.row{display:flex;gap:8px;align-items:center}
small,.mute{color:var(--mute)}
#app{display:grid;grid-template-columns:196px minmax(0,1fr) 360px;height:100vh;height:100dvh}
#nav{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:var(--panel2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;padding:0 8px 16px}
.brand svg{width:28px;height:28px;flex:none}
#nav button[data-view]{border:0;background:transparent;text-align:left;font-weight:500;display:flex;align-items:center;gap:10px}
#nav button[data-view] svg{width:18px;height:18px;flex:none;opacity:.7}
#nav button[data-view].on{background:var(--panel);box-shadow:var(--sh);font-weight:700}
#runchip{margin-top:auto}
.tip{border:0;background:transparent;text-align:left;font-size:12px;color:var(--mute);display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:8px;min-height:0}.tip:empty{display:none}.tip kbd{color:var(--ink)}
kbd.k{margin-left:6px;opacity:.75;font-size:11px;background:transparent;border-color:currentColor}
.runbox{background:var(--acc2);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
.runbox b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.runbox .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc)}
#nav #sidebtn{display:none}
#main{overflow:auto;padding:26px clamp(16px,3vw,40px) 80px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:18px}
.head h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.01em}
.head .sub{color:var(--mute);margin-top:4px;font-size:15px}
.dnav{display:flex;gap:4px}
.dnav button{min-width:38px;padding:6px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--acc2);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.obj{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;background:var(--panel)}
.obj.done{text-decoration:line-through;color:var(--mute)}
.load{margin:4px 0 16px}
.lbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;display:flex}
.lbar i{display:block;height:100%}
.lbar .m{background:var(--evi);opacity:.55}.lbar .t{background:var(--acc)}
.load.over .lbar .t{background:var(--warn)}
.ltxt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-top:5px;flex-wrap:wrap}
.load.over .ltxt span:last-child{color:var(--warn);font-weight:600}
form.add{margin-bottom:10px}
form.add input{background:var(--panel);border-style:dashed}
.list{display:flex;flex-direction:column;gap:7px;min-height:60px;border-radius:12px;padding:2px}
.list.over,.tlin.over,.wcol .list.over{background:var(--acc2)}
.card{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:var(--sh);cursor:grab}
.card.dragging{opacity:.4}
.card.done{opacity:.6}
.card.done .ctitle{text-decoration:line-through}
.card.running{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.chk{width:22px;height:22px;min-height:22px;padding:0;border-radius:50%;border:1.5px solid var(--mute);flex:none;margin-top:1px;font-size:13px;line-height:1;color:#fff}
.card.done .chk{background:var(--ok);border-color:var(--ok)}
.cbody{flex:1;cursor:pointer}
.prio{color:var(--acc);font-weight:800;margin-right:5px}.prio.u{color:var(--warn)}
.ctitle{font-weight:600;overflow-wrap:anywhere}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12.5px;color:var(--mute);align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.src{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.ctime{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.play{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;font-size:11px}
.card:not(:hover) .play{opacity:.45}
.empty{color:var(--mute);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:12px}
.foot{color:var(--mute);font-size:13px;margin-top:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;white-space:pre-wrap}
/* semaine */
.week{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px}
.wcol{background:var(--panel2);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.wcol.today{box-shadow:inset 0 0 0 2px var(--acc)}
.wcol h3{font-size:15px;display:flex;justify-content:space-between;gap:6px;cursor:pointer}
.wcol h3 small{font-weight:500}
.wcol .card{padding:8px 9px;gap:8px}
.wcol .ctime{display:none}
.wcol form input{min-height:34px;font-size:14px;padding:5px 9px}
/* backlog */
.group{margin-bottom:22px}
.group h3{font-size:15px;margin-bottom:8px}
/* panneau latéral */
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
.stabs{display:flex;gap:4px;padding:12px 12px 8px;border-bottom:1px solid var(--line);align-items:center}
.stabs button{border:0;background:transparent;font-weight:600;color:var(--mute)}
.stabs button.on{color:var(--ink);background:var(--panel2)}
#sidebody{flex:1;overflow:auto;min-height:0;position:relative}
.sinfo{padding:18px;color:var(--mute);font-size:14px;display:flex;flex-direction:column;gap:10px}
.sinfo b{color:var(--ink)}
.calhead{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;position:sticky;top:0;background:var(--panel);z-index:3;border-bottom:1px solid var(--line)}
.allday{padding:6px 14px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.allday a{font-size:12.5px;background:var(--ev);color:var(--evi);border-radius:6px;padding:2px 8px;text-decoration:none}
.tl{position:relative;padding:8px 10px 20px 52px}
.tlin{position:relative;border-radius:8px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:-46px;top:-9px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.work{position:absolute;left:0;right:0;background:var(--acc2);opacity:.35;pointer-events:none}
.ev,.blk{position:absolute;border-radius:7px;padding:3px 7px;font-size:12.5px;overflow:hidden;line-height:1.25;text-decoration:none}
.ev{background:var(--ev);color:var(--evi);border-left:3px solid var(--evi)}
.blk{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--acc));box-shadow:var(--sh);cursor:grab;color:var(--ink)}
.blk.active{box-shadow:0 0 0 2px var(--acc),var(--sh);background:var(--acc2)}
.blk.active small::after{content:' · en cours';font-weight:700;color:var(--acc)}
.blk.done{opacity:.55;text-decoration:line-through}
.ev b,.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small,.blk small{font-size:11px}
.short{display:flex;gap:6px;align-items:center;padding-top:1px;padding-bottom:1px}.short b{flex:1;order:2}.short small{order:1;flex:none}
.now{position:absolute;left:-6px;right:0;border-top:2px solid var(--warn);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.blk{display:block}.blk .bchk{position:absolute;right:4px;top:3px;width:18px;height:18px;min-height:18px;padding:0;border-radius:50%;border:1.5px solid var(--mute);background:var(--panel);font-size:10px;line-height:1;color:#fff}
.blk.done .bchk{background:var(--ok);border-color:var(--ok)}
.blk b{padding-right:20px}
.blk .rz{position:absolute;left:0;right:0;bottom:0;height:7px;cursor:ns-resize}
.blk .rz::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:var(--line)}
.hl{outline:2px solid var(--acc)!important;outline-offset:1px}
.ghostblk{position:absolute;left:2px;right:2px;border-radius:7px;background:var(--acc2);border:2px dashed var(--acc);pointer-events:none;z-index:4;font-size:12px;padding:2px 7px;color:var(--ink)}
.ctime .est{cursor:pointer;border-radius:6px;padding:1px 4px}.ctime .est:hover{background:var(--panel2)}
#pop{position:fixed;z-index:70;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:8px;display:flex;flex-wrap:wrap;gap:4px;width:236px}
#pop button{min-width:52px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;border-radius:0;min-height:36px}.seg button.on{background:var(--ink);color:var(--bg)}
.bigcal{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:auto;height:calc(100vh - 190px);height:calc(100dvh - 190px);min-height:360px}
.bchead,.bcbody{display:grid;grid-template-columns:54px repeat(var(--n),minmax(0,1fr))}
.bchead{border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:5}
.bcday{padding:8px 8px 6px;border-left:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;gap:2px}
.bcday.today b{color:var(--acc)}.bcday small{color:var(--mute);font-size:12px}.bcday .allday{padding:4px 0 0;border:0}
.bcbody{position:relative;padding:8px 0 16px}
.axis{position:relative}.axis .hr{border-top:0}.axis .hr span{left:auto;right:8px}
.bccol{border-left:1px solid var(--line);padding:0 3px}.bccol .hr span{display:none}
.ghostline{position:absolute;left:0;right:0;height:3px;background:var(--acc);border-radius:2px;pointer-events:none;z-index:4}
.todo-item{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:grab;font-size:14px}
.todo-item span{flex:1;overflow-wrap:anywhere}
.todo-item.imp span{color:var(--mute)}
.todo-item .hi{color:var(--warn);font-weight:800}
.todo-top{padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--acc2);border-radius:10px;padding:8px 12px;font-size:13px;margin:10px 14px}
/* modale */
.modal{position:fixed;inset:0;background:rgba(15,17,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;z-index:50;overflow:auto}
.sheet{background:var(--panel);border-radius:16px;width:min(640px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhead{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.mtitle{font-size:20px;font-weight:700;border-color:transparent;padding-left:4px}
.mtitle:hover{border-color:var(--line)}
.x{border:0;background:transparent;font-size:22px;min-width:38px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);font-weight:500}
label.full{margin-top:12px}
.subs{margin-top:16px}
.subs h4{font-size:13px;color:var(--mute);font-weight:500;margin-bottom:6px}
.sub{display:flex;align-items:center;gap:8px;padding:4px 0}
.sub .chk{width:18px;height:18px;min-height:18px;font-size:10px}
.sub.cur{background:var(--acc2);border-radius:8px;padding-left:6px}
.sub .play{width:26px;height:26px;min-height:26px;font-size:10px}
.sub.d span{text-decoration:line-through;color:var(--mute)}
.sub span{flex:1}
.sub .x{font-size:16px;min-height:28px;min-width:28px}
.sub.d .chk{background:var(--ok);border-color:var(--ok)}
.subs form input{min-height:34px;font-size:14px;margin-top:4px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
/* rituels */
.rsteps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.rsteps span{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mute)}
.rsteps span.on{background:var(--acc);color:#fff;font-weight:600}
.rsteps span.past{color:var(--ink)}
.rit h2{font-size:24px;font-weight:800;margin-bottom:6px}
.lead{color:var(--mute);margin:0 0 14px}
.rlist{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:46vh;overflow:auto}
.rrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.rrow small{display:block}
.rrow .btns{display:flex;gap:5px;flex-wrap:wrap}
.rrow.sel{border-color:var(--acc);background:var(--acc2)}
.durs{display:flex;gap:4px;flex-wrap:wrap}
.durs button{min-width:46px}
.durs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rsec{font-size:13px;color:var(--mute);font-weight:600;margin:16px 0 4px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.stat div{background:var(--panel2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.brow{display:grid;grid-template-columns:100px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.brow .bt{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--c)}
.brow span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* focus */
.focus{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;display:flex;justify-content:center;padding:5vh 18px}
.fwrap{width:min(620px,100%);display:flex;flex-direction:column;gap:16px}
.ftop{display:flex;align-items:center;gap:10px}
.ftop .x{margin-left:auto;font-size:14px}
.ftitle{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.01em}
.fclock{font-size:clamp(56px,12vw,96px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--acc)}
.fsub{color:var(--mute)}
.fbtns{display:flex;flex-wrap:wrap;gap:10px}
.fnotes{min-height:110px}
/* réglages */
.set{max-width:720px;display:flex;flex-direction:column;gap:24px}
.set section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.set h2{font-size:18px;margin-bottom:4px}
.set p{margin:4px 0 12px;color:var(--mute);font-size:14px}
.set .grid2{margin-top:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status.on::before{background:var(--ok)}
.chrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.chrow input[type=color]{padding:2px;height:40px}
code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:600 12.5px Figtree,sans-serif}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
/* assistant Claude */
.chat{display:flex;flex-direction:column;gap:10px;padding:14px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:var(--acc2);align-self:flex-end;max-width:88%}
.msg.a{background:var(--panel2);max-width:100%}
.prop{display:flex;flex-direction:column;gap:6px;margin-top:8px;white-space:normal}
.pitem{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px}
.pitem div{flex:1}.pitem small{display:block}
.pitem.ok{opacity:.55}
.aibar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.aibar button{font-size:12.5px;min-height:30px;padding:3px 10px;border-radius:99px}
.aiform{display:flex;gap:6px;padding:0 14px 14px}
.aiform button{flex:none}
.aiform textarea{min-height:42px;max-height:140px;font-size:15px}
.aisug{display:inline-flex;align-items:center;gap:4px;background:var(--acc2);color:var(--ink);border-radius:6px;padding:0 0 0 6px;font-size:12px}
.aisug button{min-height:22px;height:22px;padding:0 6px;border:0;background:transparent;font-size:12px}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;padding:0 4px}
.aibox{margin-top:14px;border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:14px;display:flex;flex-direction:column;gap:6px}
.aibox p{margin:0;white-space:pre-wrap}
.evlist{display:flex;flex-direction:column;gap:5px;margin:0 0 14px}
.evlist h4{font-size:13px;color:var(--mute);font-weight:600;margin:0 0 2px}
.evrow{display:flex;align-items:center;gap:10px;background:var(--ev);color:var(--evi);border-radius:9px;padding:6px 10px;font-size:14px}

<script>
{
/* ---------- configuration (identifiants par défaut, remplis à l'installation) ---------- */
const CONFIG={googleClientId:'24499808678-iini1scq6npi7bqrj4n8vnvclnljmgr9.apps.googleusercontent.com',msClientId:''};
/* ---------- utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseYmd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const monday=s=>{const d=parseYmd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)};
const fmtMin=m=>{m=Math.round(m||0);if(m<60)return m+' min';const h=Math.floor(m/60),r=m%60;return h+' h'+(r?' '+pad(r):'')};
const fmtDay=(s,o)=>parseYmd(s).toLocaleDateString('fr-FR',o||{weekday:'long',day:'numeric',month:'long'});
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
const clock=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':'+pad(m):m)+':'+pad(s)};
const strip=h=>{try{return new DOMParser().parseFromString(h||'','text/html').body.textContent.trim()}catch(e){return ''}};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};

/* ---------- données ---------- */
const KEY='journee.v1';
const defaults=()=>({tasks:[],recurring:[],objectives:[],days:{},weeks:{},running:null,seeded:false,
 channels:[{id:'c1',name:'Travail',color:'#3b6fd8'},{id:'c2',name:'Perso',color:'#2f9e6a'},{id:'c3',name:'Admin',color:'#c99a06'}],
 settings:{googleClientId:'',msClientId:'',calendarId:'primary',todoList:'',dayStart:7,dayEnd:21,workStart:9,workEnd:18,aiKey:'',aiModel:'claude-haiku-5-5',aiAuto:true,aiBudget:3,notif:false},chat:[],archive:[]});
let S;
try{S=Object.assign(defaults(),JSON.parse(lsGet(KEY)||'{}'))}catch(e){S=defaults()}
S.settings=Object.assign(defaults().settings,S.settings||{});
if(!S.settings.googleClientId)S.settings.googleClientId=CONFIG.googleClientId;
if(!S.settings.msClientId)S.settings.msClientId=CONFIG.msClientId;
let pushT=null;
const save=()=>{S.updatedAt=Date.now();lsSet(KEY,JSON.stringify(S));clearTimeout(pushT);pushT=setTimeout(()=>driveSync(),4000);if(typeof queueFlow==='function')queueFlow()};
const mk=o=>Object.assign({id:uid(),title:'',notes:'',channel:null,est:0,actual:0,day:null,done:false,doneAt:null,subtasks:[],order:0,objId:null,recurId:null,src:null,block:null,prio:''},o);
const T=id=>S.tasks.find(t=>t.id===id);
const ch=id=>S.channels.find(c=>c.id===id);
const nextOrder=day=>Math.max(0,...S.tasks.filter(t=>t.day===day).map(t=>t.order||0))+1;
const dayTasks=d=>S.tasks.filter(t=>t.day===d).sort((a,b)=>(a.done-b.done)||(a.order-b.order));
const pastUndone=()=>S.tasks.filter(t=>t.day&&t.day<today()&&!t.done).sort((a,b)=>a.day<b.day?-1:1);
const actualSec=t=>(t.actual||0)+(S.running&&S.running.taskId===t.id?(Date.now()-S.running.start)/1000:0);
const weekObjs=w=>S.objectives.filter(o=>o.week===w);

if(!S.seeded){
 S.seeded=true;const d=today();
 [['Exemple : préparer la réunion de lundi',d,'c1',45],['Exemple : répondre aux mails importants',d,'c1',30],['Exemple : courses pour le week-end',d,'c2',30],['Exemple : renouveler l’assurance auto',null,'c3',20],['Exemple : trier les photos de vacances',null,'c2',60]]
  .forEach(([title,day,channel,est],i)=>S.tasks.push(mk({title,day,channel,est,order:i+1})));
 save();
}

/* ---------- état d'interface ---------- */
const VIEWS=['today','week','dump','backlog','objectives','settings'];
let view='today',cur=today(),sideTab='cal',modalTask=null,ritual=null,focusOn=null,focusSub=null,drag=null,scrolledCal='',lastDay=today();
let gEvents={},gLoading={};
const todo={lists:null,listId:S.settings.todoList||null,tasks:{},loading:false,tLoading:false};

/* ---------- bus d'événements (point d'accroche des futurs modules : gamification, import…) ---------- */
const bus=new EventTarget();
const emit=(type,detail)=>{try{bus.dispatchEvent(new CustomEvent(type,{detail}))}catch(e){}};
window.journee={bus,get state(){return S},save:()=>save(),render:()=>render()};

/* ---------- tâches ---------- */
function parseQuick(txt){
 let est=0,channel=null;
 txt=(' '+txt+' ').replace(/\s~?(\d{1,2})\s?h\s?(\d{1,2})?(?=\s)/i,(m,h,mm)=>{est=+h*60+(+mm||0);return ' '})
  .replace(/\s~?(\d{1,3})\s?(?:m|min|mn)(?=\s)/i,(m,n)=>{est=+n;return ' '})
  .replace(/\s#(\S+)/,(m,n)=>{const c=S.channels.find(c=>c.name.toLowerCase().startsWith(n.toLowerCase()));if(c){channel=c.id;return ' '}return m});
 let day;const t0=today(),WD=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
 txt=txt.replace(/\s(aujourd['’]hui|auj)(?=\s)/i,()=>{day=t0;return ' '})
  .replace(/\s(après-demain|apres-demain)(?=\s)/i,()=>{day=addDays(t0,2);return ' '})
  .replace(/\s(demain)(?=\s)/i,()=>{day=addDays(t0,1);return ' '})
  .replace(/\s(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(?=\s)/i,(m,w)=>{const k=WD.indexOf(w.toLowerCase()),c=parseYmd(t0).getDay();day=addDays(t0,((k-c+7)%7)||7);return ' '})
  .replace(/\s(\d{1,2})\/(\d{1,2})(?=\s)/,(m,dd,mm)=>{const y=new Date().getFullYear();let d=ymd(new Date(y,+mm-1,+dd));if(d<t0)d=ymd(new Date(y+1,+mm-1,+dd));day=d;return ' '});
 return {title:txt.trim().replace(/\s+/g,' '),est,channel,day};
}
function addTask(text,day){
 const q=parseQuick(text);if(!q.title)return null;if(q.day!==undefined)day=q.day;
 const t=mk({title:q.title,est:q.est,channel:q.channel,day,order:nextOrder(day)});
 S.tasks.push(t);save();render();aiWatch(t);emit('task:add',{task:t});return t;
}
async function toggleDone(id){
 const t=T(id);if(!t)return;
 if(S.running&&S.running.taskId===id)stopTimer();
 t.done=!t.done;t.doneAt=t.done?Date.now():null;if(t.done&&!t.day)t.day=today();
 if(t.done)finishBlock(t);
 save();render();if(t.done)chime(660);emit(t.done?'task:done':'task:undone',{task:t});
 if(t.block&&t.block.gcalId&&gTok())gFetch(`/calendars/${calId()}/events/${encodeURIComponent(t.block.gcalId)}`,{method:'PATCH',body:JSON.stringify({summary:(t.done?'✓ ':'')+t.title})}).catch(()=>{});
 if(t.src&&msOn()){
  try{await graph(`/me/todo/lists/${encodeURIComponent(t.src.listId)}/tasks/${encodeURIComponent(t.src.taskId)}`,{method:'PATCH',body:JSON.stringify({status:t.done?'completed':'notStarted'})});delete todo.tasks[t.src.listId];renderSide()}
  catch(e){toast('To Do : '+e.message)}
 }
}
function moveTask(id,to,noRender){
 const t=T(id);if(!t)return;
 const day=to==='backlog'?null:to;
 if(t.block&&ymd(new Date(t.block.start))!==day)clearBlock(t,true);
 t.day=day;if(day)t.inbox=false;t.order=nextOrder(day);save();if(!noRender)render();
}
function deleteTask(id){
 const t=T(id);if(!t)return;
 if(S.running&&S.running.taskId===id)S.running=null;
 if(t.recurId){const r=S.recurring.find(x=>x.id===t.recurId);if(r&&t.day){r.skip=r.skip||[];r.skip.push(t.day)}}
 if(t.block)clearBlock(t,true);
 S.tasks=S.tasks.filter(x=>x!==t);save();
}
function rolloverAll(to){
 for(const t of pastUndone()){if(t.recurId)deleteTask(t.id);else moveTask(t.id,to,true)}
 save();render();
}
function renorm(day){dayTasks(day).forEach((t,i)=>t.order=i+1)}

/* ---------- récurrence ---------- */
const RULES={daily:'Tous les jours',weekdays:'Jours ouvrés (lun–ven)',weekly:'Chaque semaine',monthly:'Chaque mois'};
function matches(r,day){const d=parseYmd(day),w=d.getDay();switch(r.rule){case'daily':return true;case'weekdays':return w>0&&w<6;case'weekly':return w===r.dow;case'monthly':return d.getDate()===r.dom}return false}
function genRecurring(){
 const t0=today();let changed=false;
 for(let i=0;i<7;i++){const day=addDays(t0,i);
  for(const r of S.recurring){
   if(day<r.from||(r.skip||[]).includes(day)||!matches(r,day))continue;
   if(S.tasks.some(t=>t.recurId===r.id&&t.day===day))continue;
   S.tasks.push(mk({title:r.title,channel:r.channel,est:r.est,notes:r.notes||'',day,recurId:r.id,order:nextOrder(day),subtasks:(r.subs||[]).map(x=>({id:uid(),t:x,d:false}))}));changed=true;
  }}
 if(changed)save();
}
function setRecur(t,rule){
 let r=t.recurId&&S.recurring.find(x=>x.id===t.recurId);
 if(!rule){
  if(r){S.recurring=S.recurring.filter(x=>x!==r);S.tasks=S.tasks.filter(x=>!(x.recurId===r.id&&x!==t&&!x.done&&x.day&&x.day>(t.day||today())))}
  t.recurId=null;return;
 }
 if(!t.day)t.day=today();
 if(!r){r={id:uid(),title:t.title,channel:t.channel,est:t.est,notes:t.notes,subs:t.subtasks.map(s=>s.t),from:t.day,skip:[]};S.recurring.push(r);t.recurId=r.id}
 const b=parseYmd(t.day);r.rule=rule;r.dow=b.getDay();r.dom=b.getDate();
 S.tasks=S.tasks.filter(x=>!(x.recurId===r.id&&x!==t&&!x.done&&x.day>t.day&&!matches(r,x.day)));
 genRecurring();
}

/* ---------- minuteur ---------- */
function startTimer(id){stopTimer();S.running={taskId:id,start:Date.now()};save();render()}
function stopTimer(){if(!S.running)return;const t=T(S.running.taskId);if(t)t.actual=Math.round((t.actual||0)+(Date.now()-S.running.start)/1000);S.running=null;save()}
let actx=null;
function chime(f){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f||880;o.type='sine';g.gain.setValueAtTime(.0001,actx.currentTime);g.gain.exponentialRampToValueAtTime(.18,actx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.5);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.55)}catch(e){}}

/* ---------- Google Agenda (OAuth implicite, côté navigateur) ---------- */
const REDIRECT=location.origin+location.pathname;
const calId=()=>encodeURIComponent(S.settings.calendarId||'primary');
function gTok(){try{const o=JSON.parse(lsGet('journee.g')||'null');return o&&o.exp>Date.now()+30000?o.t:null}catch(e){return null}}
const gWas=()=>!!lsGet('journee.g.on');
function gLogin(silent){
 if(!S.settings.googleClientId){toast('Ajoute d’abord ton identifiant client Google dans Réglages');go('settings');return}
 const hint=lsGet('journee.g.email');
 const p=new URLSearchParams({client_id:S.settings.googleClientId.trim(),redirect_uri:REDIRECT,response_type:'token',scope:'email https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/drive.appdata',include_granted_scopes:'true',state:(silent?'gs':'g')+'|'+view+'|'+cur,prompt:silent?'none':'consent'});
 if(hint)p.set('login_hint',hint);
 if(silent)lsSet('journee.g.last',String(Date.now()));
 location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p;
}
function gSilent(){
 // renouvelle la session Google sans clic (aller-retour éclair) quand elle a expiré et que tu n'es pas en train de saisir
 if(gTok()||!gWas()||document.hidden||!S.settings.googleClientId)return;
 if(!$('#modal').classList.contains('hidden')||focusOn||drag||rz)return;
 const a=document.activeElement;if(a&&a.matches('input,textarea,select')&&a.value)return;
 const last=+(lsGet('journee.g.last')||0),fail=+(lsGet('journee.g.fail')||0);
 if(Date.now()-last<3*60000||Date.now()-fail<30*60000)return;
 gLogin(true);
}
function gLogout(){lsDel('journee.g');lsDel('journee.g.on');lsDel('journee.g.email');gEvents={};render()}
async function gFetch(path,opts={}){
 const t=gTok();if(!t)throw new Error('session expirée, reconnecte Google');
 const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{...opts,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}});
 if(r.status===401){lsDel('journee.g');throw new Error('session expirée, reconnecte Google')}
 if(r.status===204)return null;
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('erreur '+r.status));return j;
}
let gErr='',gCals=null;
const gScope=()=>{try{return (JSON.parse(lsGet('journee.g')||'{}').scope)||''}catch(e){return ''}};
async function loadCals(){
 if(gCals)return gCals;
 try{const j=await gFetch('/users/me/calendarList?minAccessRole=reader&maxResults=100');gCals=(j.items||[]).map(c=>({id:c.id,name:c.summaryOverride||c.summary,color:c.backgroundColor,primary:!!c.primary,selected:c.selected!==false}))}
 catch(e){gCals=[{id:S.settings.calendarId||'primary',name:'Agenda principal',primary:true,selected:true}]}
 return gCals;
}
const calOn=c=>{const m=(S.settings.cals||{})[c.id];return m===undefined?c.selected:m};
async function ensureRange(from,to,force){
 if(!gTok())return;
 const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
 if(!force&&days.every(d=>gEvents[d]))return;
 const k=from+to;if(gLoading[k])return;gLoading[k]=1;
 try{
  const tMin=parseYmd(from).toISOString(),tMax=parseYmd(addDays(to,1)).toISOString();let items=[],page='';
  const cals=(await loadCals()).filter(calOn);
  for(const c of cals){page='';
   do{const j=await gFetch(`/calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}${page?'&pageToken='+encodeURIComponent(page):''}`);(j.items||[]).forEach(e=>{e._cal=c.name;e._col=c.color});items=items.concat(j.items||[]);page=j.nextPageToken}while(page);
  }
  gErr='';
  days.forEach(d=>gEvents[d]=[]);
  for(const e of items){

 if(r.status===401){lsDel('journee.g');throw new Error('session expirée')}

  const q=encodeURIComponent("name='journee.json'");
  const list=await (await dfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`)).json();
  const f=list.files&&list.files[0];

  const r0=list[0],rule=r0.sequenceRule;const tpl={id:'sun-r-'+r0.id,title:r0.text,channel:chIdx[(r0.channel||'').replace(/^#/,'')]||null,est:+r0.timeEstimate||0,notes:'',subs:[],from:addDays(last,1),skip:[]};

  if(/every day/.test(rule))tpl.rule='daily';else if((m=rule.match(/every week on (\w+)/i))){tpl.rule='weekly';tpl.dow=DAYS.indexOf(m[1].toLowerCase())}else if((m=rule.match(/every month on the (\d+)/))){tpl.rule='monthly';tpl.dom=+m[1]}else continue;
  if(!S.recurring.some(x=>x.id===tpl.id)){S.recurring.push(tpl);st.recurring++}recMap[k]=tpl.id}
 const objMap={};S.archive=S.archive||[];
 const have=new Set(S.tasks.map(t=>t.id)),haveA=new Set(S.archive.map(a=>a.id));
 for(const r of rows){
  const id='sun-'+r.id;if(have.has(id)||haveA.has(id)){st.dup++;continue}
  if(!r.text||RIT.test(r.text.trim())){st.skipped++;continue}
  const done=!!r.completedDate;let day=r.startDate||null;const chId=chIdx[(r.channel||'').replace(/^#/,'')]||null;
  const actual=+r.actualTimeSeconds||0,est=+r.timeEstimate||0;
  if(done&&day&&day<stale){const a={id,t:r.text,c:chId,d:day,e:est,a:actual};if(r.objective)a.o=r.objective;S.archive.push(a);st.archive++;continue}
  if(!done&&day&&day<stale)day=null;
  const subs=jparse(r.subtasks,[]).map(x=>({id:uid(),t:x.title||'',d:!!x.completedDate})).filter(x=>x.t);
  const t=mk({id,title:r.text,notes:htmlText(r.notes),channel:chId,est,actual,day,done,doneAt:done?Date.parse(r.completedDate):null,subtasks:subs,order:r.createdAt?Date.parse(r.createdAt)/1e12:0,
   prio:{Urgent:'urgent',Priority:'high','Low Priority':'low'}[r.latestDailyPriority]||'',recurId:recMap[r.text+'|'+r.sequenceRule]||null});
  const sch=jparse(r.scheduledTime,[])[0];if(!done&&day&&day>=t0&&sch&&sch.startDate&&sch.endDate)t.block={start:sch.startDate,end:sch.endDate,gcalId:null,title:t.title};
  if(r.objective&&day&&day>=stale){const w=monday(day),k=w+'|'+r.objective;if(!objMap[k]){let o=S.objectives.find(o=>o.week===w&&o.title===r.objective);if(!o){o={id:'sun-o-'+uid(),week:w,title:r.objective,done:false};S.objectives.push(o);st.objectives++}objMap[k]=o}t.objId=objMap[k].id}
  S.tasks.push(t);st.tasks++;
 }
 for(const o of Object.values(objMap)){const lt=S.tasks.filter(t=>t.objId===o.id);if(lt.length&&lt.every(t=>t.done))o.done=true}
 for(const d of new Set(S.tasks.filter(t=>t.day).map(t=>t.day)))renorm(d);
 genRecurring();save();render();emit('import:sunsama',st);return st;
}

/* ---------- panneau latéral : agenda ---------- */
const PX=56;
function calGeom(){const st=S.settings.dayStart,en=Math.max(S.settings.dayEnd,st+1);return{st,en,H:(en-st)*PX}}
function calCol(d){
 const s=S.settings,{st,en,H}=calGeom();
 const timed=timedEvents(d),blocks=S.tasks.filter(t=>t.block&&ymd(new Date(t.block.start))===d);
 const items=[...timed.map(e=>({k:'ev',s:new Date(e.start.dateTime),e:new Date(e.end.dateTime),e0:e})),...blocks.map(t=>({k:'b',s:new Date(t.block.start),e:new Date(t.block.end),t}))].sort((a,b)=>a.s-b.s||b.e-a.e);
 let cl=[],cend=0;const out=[];
 const flush=()=>{const cols=[];cl.forEach(it=>{let c=cols.findIndex(e=>e<=it.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.e;it.col=c});cl.forEach(it=>it.n=cols.length);out.push(...cl);cl=[]};
 items.forEach(it=>{if(cl.length&&it.s>=cend)flush();cl.push(it);cend=Math.max(cend,+it.e)});flush();
 const y=dt=>((dt.getHours()-st)*60+dt.getMinutes()+(ymd(dt)!==d?(dt>parseYmd(d)?1440:-1440):0))/60*PX;
 const hrs=[...Array(en-st+1)].map((_,i)=>`<div class="hr" style="top:${i*PX}px"><span>${pad(st+i)}:00</span></div>`).join('');
 const blocksHtml=out.map(it=>{
  const top=Math.max(0,y(it.s)),h=Math.max(20,Math.min(H,y(it.e))-top),w=100/it.n,l=it.col*w;
  const pos=`top:${top}px;height:${h}px;left:calc(${l}% + 2px);width:calc(${w}% - 4px)`,sh=h<36?' short':'';
  if(it.k==='ev'){const e=it.e0,f=evFree(e);return `<div class="ev${sh}${f?' free':''}" style="${pos};${e._col?'border-left-color:'+esc(e._col):''}" data-act="evtoggle" data-k="${esc(evKey(e))}" title="${f?'Tu peux travailler pendant ce rendez-vous':'Occupé'} — clique pour changer">${/^https:/.test(e.htmlLink||'')?`<a href="${esc(e.htmlLink)}" target="_blank" rel="noopener" aria-label="Ouvrir dans Google Agenda">↗</a>`:''}<b>${esc(e.summary||'(sans titre)')}</b><small>${hm(it.s)}${sh?'':'–'+hm(it.e)}${f?' · dispo':''}</small></div>`}
  const t=it.t,c=ch(t.channel),act=S.running&&S.running.taskId===t.id;return `<div class="blk${t.done?' done':''}${act?' active':''}${sh}" style="${pos};--c:${esc(c?c.color:'var(--acc)')}" draggable="true" data-drag="blk|${t.id}" data-act="open" data-id="${t.id}"><button class="bchk" data-act="toggle" data-id="${t.id}" aria-label="${t.done?'Rouvrir':'Terminer'}">${t.done?'✓':''}</button><b>${t.pinned?'📌 ':''}${esc(t.title)}</b><small>${hm(it.s)}${sh?'':'–'+hm(it.e)}</small><i class="rz" data-rz="${t.id}" title="Étirer pour changer la durée"></i></div>`;
 }).join('');
 const nowTop=d===today()?y(new Date()):-1;
 return `<div class="tlin" data-drop="cal" data-day="${d}" style="height:${H}px">${hrs}
 <div class="work" style="top:${(s.workStart-st)*PX}px;height:${Math.max(0,(s.workEnd-s.workStart)*PX)}px"></div>
 ${blocksHtml}${nowTop>=0&&nowTop<=H?`<div class="now" data-live="now" style="top:${nowTop}px"></div>`:''}<div class="ghostblk hidden"></div></div>`;
}
const alldayHtml=d=>{const a=(gEvents[d]||[]).filter(e=>e.start.date);return a.length?`<div class="allday">${a.map(e=>`<a href="${/^https:/.test(e.htmlLink||'')?esc(e.htmlLink):'#'}" target="_blank" rel="noopener">${esc(e.summary||'(sans titre)')}</a>`).join('')}</div>`:''};
function gStateHtml(d){return gTok()?(gErr?`<div class="pill">${esc(gErr)} — reconnecte Google et coche toutes les cases<button class="sm pri" data-act="gin">Reconnecter</button></div>`:(gScope()&&!/calendar/.test(gScope())?`<div class="pill">Google connecté sans l’accès Agenda<button class="sm pri" data-act="gin">Reconnecter</button></div>`:'')):gWas()?`<div class="pill">Session Google expirée<button class="sm pri" data-act="gin">Reconnecter</button></div>`:`<div class="pill">Connecte Google Agenda pour voir tes rendez-vous<button class="sm" data-act="gin">Connecter</button></div>`}
function viewCal(){
 const d=cur;
 return `<div class="calhead"><span>${cap1(fmtDay(d,{weekday:'long',day:'numeric',month:'short'}))}</span><span class="sp"></span><button class="sm ghost" data-act="layout" title="Inverser : grand agenda au centre (touche C)">⇄ Grand agenda</button>${gTok()?'<button class="sm ghost" data-act="refresh">Actualiser</button>':''}</div>
 ${gStateHtml(d)}${alldayHtml(d)}
 <div class="tl">${calCol(d)}</div>
 <div class="sinfo" style="padding-top:0"><span>${flowOn()?'Agenda vivant : les tâches suivent l’ordre de la liste. Glisse une tâche ici pour fixer son heure.':'Glisse une tâche sur l’agenda pour lui réserver un créneau.'}</span>${flowOn()?'':'<button class="sm" data-act="autobox">Placer automatiquement les tâches du jour</button>'}</div>`;
}
/* ---------- grand agenda (vue inversée) ---------- */
let scrolledBig=false,layout=lsGet('journee.layout')||'tasks',calSpan=+(lsGet('journee.span')||3);
const bigDays=()=>{const n=innerWidth<720?1:calSpan;const s0=n===7?monday(cur):cur;return [...Array(n)].map((_,i)=>addDays(s0,i))};
function viewBigCal(){
 const days=bigDays(),{st,en,H}=calGeom();
 const axis=[...Array(en-st+1)].map((_,i)=>`<div class="hr" style="top:${i*PX}px"><span>${pad(st+i)}:00</span></div>`).join('');
 return `<div class="head"><div><h1>${days.length===1?cap1(fmtDay(days[0],{weekday:'long',day:'numeric',month:'long'})):cap1(fmtDay(days[0],{day:'numeric',month:'short'}))+' – '+fmtDay(days[days.length-1],{day:'numeric',month:'short'})}</h1><div class="sub">Grand agenda · tes tâches sont à droite</div></div>
 <div class="dnav"><button data-act="${days.length===7?'prevw':'prev'}" aria-label="Précédent">‹</button><button data-act="gotoday">Aujourd’hui</button><button data-act="${days.length===7?'nextw':'next'}" aria-label="Suivant">›</button></div>
 <div class="acts"><div class="seg">${[1,3,7].map(n=>`<button class="sm${calSpan===n?' on':''}" data-act="span" data-n="${n}">${n===1?'Jour':n===3?'3 jours':'Semaine'}</button>`).join('')}</div><button data-act="layout" title="Touche C">⇄ Liste au centre<kbd class="k">C</kbd></button></div></div>
 ${gStateHtml(cur)}
 <div class="bigcal" style="--n:${days.length}">
  <div class="bchead"><div></div>${days.map(d=>`<div class="bcday${d===today()?' today':''}" data-act="openday" data-day="${d}"><b>${cap1(fmtDay(d,{weekday:'short',day:'numeric'}))}</b><small>${fmtMin(loadInfo(d).task)} de tâches</small>${alldayHtml(d)}</div>`).join('')}</div>
  <div class="bcbody"><div class="axis" style="height:${H}px">${axis}</div>${days.map(d=>`<div class="bccol">${calCol(d)}</div>`).join('')}</div>
 </div>`;
}
function viewSideTasks(){
 const d=cur,ts=dayTasks(d);
 return `<div class="calhead"><span>Tâches · ${cap1(fmtDay(d,{weekday:'long',day:'numeric'}))}</span><span class="sp"></span><button class="sm ghost" data-act="plan">Planifier</button></div>
 <div style="padding:10px 12px">${loadBar(d)}${addForm(d,'Ajouter une tâche…','add-side')}
 <div class="list" data-drop="day:${d}">${ts.length?ts.map(card).join(''):'<div class="empty">Rien de prévu ce jour-là.</div>'}</div>
 <div class="rsec">Backlog</div><div class="list" data-drop="backlog">${S.tasks.filter(t=>!t.day&&!t.done).slice(0,30).map(card).join('')||'<p class="mute">Vide</p>'}</div></div>`;
}

/* ---------- panneau latéral : To Do ---------- */
function viewTodo(){
 if(!S.settings.msClientId)return `<div class="sinfo"><b>Microsoft To Do n’est pas encore configuré.</b><span>Crée une application dans Azure (5 minutes, voir le README), puis colle son identifiant dans Réglages.</span><button data-act="goset">Ouvrir les réglages</button></div>`;
 if(!msOn())return `<div class="sinfo"><b>Connecte ton compte Microsoft</b><span>Tes listes To Do apparaîtront ici. Glisse une tâche vers ta journée ou ton agenda.</span><button class="pri" data-act="min">Connecter Microsoft</button></div>`;
 if(!todo.lists){loadTodoLists();return '<div class="sinfo">Chargement des listes…</div>'}
 if(!todo.lists.length)return '<div class="sinfo">Aucune liste trouvée.<button class="sm" data-act="todoreload">Réessayer</button></div>';
 const l=todo.listId,items=todo.tasks[l];
 if(!items)loadTodoTasks(l);
 return `<div class="todo-top"><select data-todolist aria-label="Liste To Do">${todo.lists.map(x=>`<option value="${esc(x.id)}" ${x.id===l?'selected':''}>${esc(x.displayName)}</option>`).join('')}</select><button class="sm ghost" data-act="todoreload">Actualiser</button></div>
 ${!items?'<div class="sinfo">Chargement…</div>':!items.length?'<div class="sinfo">Cette liste est vide.</div>':items.map(x=>{const imp=S.tasks.find(t=>t.src&&t.src.taskId===x.id);const due=x.dueDateTime&&x.dueDateTime.dateTime?`<small>${fmtDay(x.dueDateTime.dateTime.slice(0,10),{day:'numeric',month:'short'})}</small>`:'';
  return `<div class="todo-item${imp?' imp':''}" draggable="true" data-drag="todo|${esc(l)}|${esc(x.id)}">${x.importance==='high'?'<i class="hi" title="Important">!</i>':''}<span>${esc(x.title)}</span>${due}<button class="sm${imp?' ghost':''}" data-act="todoadd" data-l="${esc(l)}" data-t="${esc(x.id)}">${imp&&imp.day?(imp.day===cur?'Prévue':esc(fmtDay(imp.day,{day:'numeric',month:'short'}))):'+ Jour'}</button></div>`}).join('')}
 <div class="sinfo"><span>Les tâches ajoutées sont cochées dans To Do quand tu les termines ici.</span></div>`;
}

/* ---------- rendu principal ---------- */
function render(){
 const a=document.activeElement,keep=a&&a.dataset&&a.dataset.keep,val=keep?a.value:null;
 document.querySelectorAll('#nav [data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view));
 {const nb=document.querySelector('#nav [data-view="dump"]'),n=S.tasks.filter(t=>t.inbox&&!t.done).length;if(nb){const o=nb.querySelector('.badge');if(o)o.remove();if(n)nb.insertAdjacentHTML('beforeend',`<span class="badge">${n}</span>`)}}
 const m=$('#main'),st=m.scrollTop,bc0=document.querySelector('.bigcal'),bst=bc0?bc0.scrollTop:null;
 m.innerHTML=layout==='cal'&&(view==='today'||view==='week')?viewBigCal():view==='week'?viewWeek():view==='backlog'?viewBacklog():view==='dump'?viewDump():view==='objectives'?viewObjectives():view==='settings'?viewSettings():viewToday();
 m.scrollTop=st;
 renderSide();renderRun();
 if(keep){const n=document.querySelector(`[data-keep="${keep}"]`);if(n){n.focus();if(val&&!n.value)n.value=val}}
 if(layout==='cal'&&(view==='today'||view==='week')){const bd=bigDays();ensureRange(bd[0],bd[bd.length-1])}else if(view==='week'){const w=monday(cur);ensureRange(w,addDays(w,6))}else{ensureRange(cur,addDays(cur,6))}
 {const bc=document.querySelector('.bigcal');if(bc){if(!scrolledBig||bst===null){scrolledBig=true;const n=new Date();bc.scrollTop=Math.max(0,(Math.max(S.settings.dayStart,n.getHours()-1)-S.settings.dayStart)*PX)}else bc.scrollTop=bst}}
}
function renderSide(){
 document.querySelectorAll('.stabs [data-side]').forEach(b=>b.classList.toggle('on',b.dataset.side===sideTab));
 const sb=$('#sidebody'),st=sb.scrollTop;
 const bigOn=layout==='cal'&&(view==='today'||view==='week');sb.innerHTML=sideTab==='todo'?viewTodo():sideTab==='ai'?viewAI():bigOn?viewSideTasks():viewCal();
 const tb=document.querySelector('.stabs [data-side="cal"]');if(tb)tb.textContent=bigOn?'Tâches':'Agenda';
 if(sideTab==='ai'){aiUnread=0;renderBadge();}
 if(sideTab==='ai'){sb.scrollTop=sb.scrollHeight}else if(sideTab==='cal'&&!bigOn&&scrolledCal!==cur){scrolledCal=cur;const n=new Date(),h=cur===today()?Math.max(S.settings.dayStart,n.getHours()-1):S.settings.workStart;sb.scrollTop=(h-S.settings.dayStart)*PX}else sb.scrollTop=st;
}
function renderRun(){

function go(v){

function subsHtml(t){return (t.subtasks||[]).map(s=>`<div class="sub${s.d?' d':''}${focusOn===t.id&&focusSub===s.id?' cur':''}"><button class="chk" data-act="subt" data-tid="${t.id}" data-s="${s.id}" aria-label="Cocher">${s.d?'✓':''}</button><span>${esc(s.t)}</span>${s.d?'':`<button class="play" data-act="focussub" data-tid="${t.id}" data-s="${s.id}" aria-label="Focus sur cette sous-tâche">▶</button>`}<button class="x" data-act="subd" data-tid="${t.id}" data-s="${s.id}" aria-label="Supprimer">×</button></div>`).join('')}

 const t=T(id);if(!t)return;if(modalAI&&modalAI.tid!==id)modalAI=null;modalTask=id;ritual=null;
 const objs=weekObjs(monday(t.day||today())),r=t.recurId&&S.recurring.find(x=>x.id===t.recurId);
 const ests=[0,10,15,20,30,45,60,75,90,120,150,180,240];if(!ests.includes(t.est))ests.push(t.est),ests.sort((a,b)=>a-b);
 showModal(`<div class="mhead"><input class="mtitle" data-f="title" value="${esc(t.title)}" aria-label="Titre"><button class="x" data-act="close" aria-label="Fermer">×</button></div>

 <label>Créneau dans l’agenda<span class="row"><input type="time" step="900" data-f="time" value="${t.block?hm(new Date(t.block.start)):''}">${t.block&&t.pinned?'<button class="sm ghost" data-act="unpin">Libérer l’heure</button>':''}${t.block&&!flowOn()?'<button class="sm ghost" data-act="unblock">Retirer</button>':''}</span></label>
 <label>Objectif de la semaine<select data-f="obj"><option value="">Aucun</option>${objs.map(o=>`<option value="${esc(o.id)}" ${o.id===t.objId?'selected':''}>${esc(o.title)}</option>`).join('')}</select></label>
 <label>Répéter<select data-f="recur"><option value="">Jamais</option>${Object.entries(RULES).map(([k,v])=>`<option value="${k}" ${r&&r.rule===k?'selected':''}>${v}</option>`).join('')}</select></label>

document.addEventListener('drop',async e=>{
 const z=e.target.closest('[data-drop]');if(!z||!drag)return;e.preventDefault();
 const dz=z.dataset.drop,src=drag.split('|');drag=null;z.classList.remove('over');

 else t=T(src[1]);
 if(!t)return;
 if(dz==='cal'){const dd=z.dataset.day||cur,dt=parseYmd(dd);dt.setMinutes(calMinute(z,e.clientY));t.pinned=true;if(t.day!==dd)t.order=nextOrder(dd);const p=setBlock(t,dt,true);syncOrder(dd);save();render();await p;return}

  const day=dz.slice(4),before=e.target.closest('.card');

  if(!flowOn()&&reflow(day))toast('Agenda réorganisé selon le nouvel ordre');

 }

function showKeys(){showModal(`<div class="rit"><h2>Raccourcis clavier</h2><div class="keys" style="margin-top:12px">${KEYS.map(([k,l])=>`<kbd>${k}</kbd><span>${l}</span>`).join('')}</div><div class="mfoot"><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" data-tips ${lsGet('journee.tips')==='off'?'':'checked'} style="width:auto;min-height:0">Rappels réguliers en bas de l’écran</label><span class="sp"></span><button class="pri" data-act="close">OK</button></div></div>`)}
let tipI=0;
function renderTip(){const el=$('#tip');if(!el)return;if(lsGet('journee.tips')==='off'||innerWidth<720){el.innerHTML='';return}const [k,l]=KEYS[tipI%KEYS.length];el.innerHTML=`<span>Raccourci</span><kbd>${k}</kbd><span>${l}</span>`;tipI++}
setInterval(renderTip,20000);setTimeout(renderTip,1500);
function toggleLayout(){layout=layout==='cal'?'tasks':'cal';lsSet('journee.layout',layout);scrolledBig=false;if(view!=='today'&&view!=='week')view='today';if(layout==='cal')sideTab='cal';render();toast(layout==='cal'?'Grand agenda au centre, tâches à droite':'Liste au centre, agenda à droite')}
function closePop(){const p=$('#pop');if(p)p.remove()}
function estMenu(t,el){
 closePop();const r=el.getBoundingClientRect(),p=document.createElement('div');p.id='pop';
 p.innerHTML=[10,15,20,30,45,60,75,90,120,180].map(v=>`<button class="sm${t.est===v?' pri':''}" data-act="setest" data-id="${t.id}" data-v="${v}">${fmtMin(v)}</button>`).join('');
 document.body.appendChild(p);const w=236;p.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';p.style.top=Math.min(innerHeight-p.offsetHeight-8,r.bottom+6)+'px';
}
document.addEventListener('click',e=>{if(!e.target.closest('#pop')&&!e.target.closest('[data-act="estmenu"]'))closePop()},true);
document.addEventListener('mouseover',e=>{
 const el=e.target.closest('.card[data-id],.blk[data-id]');document.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));
 if(!el)return;const id=el.dataset.id;document.querySelectorAll(`.card[data-id="${id}"],.blk[data-id="${id}"]`).forEach(x=>{if(x!==el)x.classList.add('hl')});
});
let rz=null;
document.addEventListener('pointerdown',e=>{
 const h=e.target.closest('[data-rz]');if(!h)return;e.preventDefault();e.stopPropagation();
 const blk=h.closest('.blk'),t=T(h.dataset.rz);if(!t||!t.block)return;blk.draggable=false;
 rz={t,blk,y:e.clientY,h:blk.offsetHeight,start:new Date(t.block.start)};h.setPointerCapture&&h.setPointerCapture(e.pointerId);
});
document.addEventListener('pointermove',e=>{if(!rz)return;const nh=Math.max(PX/4,rz.h+(e.clientY-rz.y));const m=Math.max(15,Math.round(nh/PX*60/15)*15);rz.blk.style.height=(m/60*PX)+'px';rz.m=m;const sm=rz.blk.querySelector('small');if(sm){const end=new Date(rz.start.getTime()+m*60000);sm.textContent=hm(rz.start)+'–'+hm(end)+' · '+fmtMin(m)}});
document.addEventListener('pointerup',()=>{if(!rz)return;const {t,m}=rz;rz=null;if(m&&m!==t.est){setEst(t,m);toast('Durée : '+fmtMin(m))}else render()});
// rafraîchissement régulier de l'agenda Google
setInterval(()=>{if(!document.hidden&&gTok()&&$('#modal').classList.contains('hidden')){const a=document.activeElement;if(a&&a.matches('input,textarea'))return;const w=monday(cur);view==='week'?ensureRange(w,addDays(w,6),true):ensureRange(cur,cur,true)}},5*60*1000);

setInterval(liveTick,30000);setTimeout(liveTick,3000);
setInterval(gSilent,60000);setTimeout(gSilent,2000);
/* ---------- clavier ---------- */
document.addEventListener('keydown',e=>{if(e.target.dataset&&e.target.dataset.keep==='ai'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden'))closeModal();else if(focusOn){focusOn=null;renderFocus();render()}else document.body.classList.remove('side-open');return}
 if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey||focusOn||!$('#modal').classList.contains('hidden'))return;
 const k=e.key.toLowerCase();
 if(k==='n'){e.preventDefault();const i=document.querySelector('[data-keep^="add-"]');if(i)i.focus()}
 else if(k==='t'){cur=today();go('today')}
 else if(k==='c'){toggleLayout()}
 else if(e.key==='?'){showKeys()}
 else if(k==='d'){go('dump');setTimeout(()=>{const ta=document.querySelector('[data-dump]');if(ta){ta.focus();ta.selectionStart=ta.value.length}},50)}
 else if(k==='w')go('week');else if(k==='b')go('backlog');else if(k==='o')go('objectives');
 else if(k==='p')startRitual('plan',cur);else if(k==='s')startRitual('shutdown',cur);
 else if(k==='f'){const t=dayTasks(cur).find(t=>!t.done);if(t)openFocus(t.id)}
 else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const s=e.key==='ArrowLeft'?-1:1;cur=addDays(cur,(view==='week'||view==='objectives')?7*s:s);render()}
});

/* ---------- démarrage ---------- */
genRecurring();
render();
if(S.running&&T(S.running.taskId))renderRun();
if(msOn()&&S.settings.msClientId)setTimeout(syncTodo,1500);
setTimeout(driveSync,800);
setTimeout(aiMorning,1500);
{const r=savedRit();if(r&&Date.now()-r.at<3*3600e3&&r.day>=today()){cur=r.day;setTimeout(()=>{if(!ritual&&$('#modal').classList.contains('hidden')){ritual=r;renderRitual()}},400)}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){setTimeout(gSilent,800);liveTick();driveSync();if(msOn())syncTodo();if(gTok()){gEvents={};render()}}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
