<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journée</title>
<meta name="theme-color" content="#e8590c">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calme, posé, un carnet du matin — peu de couleurs, beaucoup d'air
   IDEA: un agenda papier ouvert : la liste du jour à gauche, la page horaire à droite
   PICTURE: la liste de tâches et la colonne horaire sont l'image elle-même
   COLOUR and TYPE: papier blanc chaud, encre presque noire, un orange lever-de-soleil ; Figtree
   LAYOUT: navigation fine | liste du jour | agenda ; empilé sur mobile */
:root{color-scheme:light dark;
--bg:light-dark(#faf8f5,#141619);--panel:light-dark(#ffffff,#1c1f24);--panel2:light-dark(#f3f0eb,#22262c);
--line:light-dark(#e8e3dc,#2d3239);--ink:light-dark(#1c1e22,#eceae6);--mute:light-dark(#6a6e77,#9aa0a9);
--acc:#e8590c;--acc2:light-dark(#fff0e6,#3a2416);--ok:#2f9e6a;--warn:#d6336c;--ev:light-dark(#e9edf3,#2a3038);--evi:light-dark(#3d4a5c,#c3ccd8);
--sh:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:8px 13px;min-height:38px}
button:hover{border-color:var(--mute)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.pri:hover{filter:brightness(1.06)}
button.ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600}
button.ghost{background:transparent}
button.danger{background:transparent;color:var(--warn);border-color:transparent}
button.sm{padding:4px 10px;min-height:30px;font-size:13px;border-radius:7px}
button.big{min-height:48px;padding:10px 20px;font-size:16px}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 11px;min-height:40px;font-size:16px;width:100%}
textarea{resize:vertical;line-height:1.5}
h1,h2,h3,h4{margin:0;line-height:1.15;text-wrap:balance}
.hidden{display:none!important}
.sp{flex:1}
.row{display:flex;gap:8px;align-items:center}
small,.mute{color:var(--mute)}
#app{display:grid;grid-template-columns:196px minmax(0,1fr) 360px;height:100vh;height:100dvh}
#nav{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;background:var(--panel2)}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;padding:0 8px 16px}
.brand svg{width:28px;height:28px;flex:none}
#nav button[data-view]{border:0;background:transparent;text-align:left;font-weight:500;display:flex;align-items:center;gap:10px}
#nav button[data-view] svg{width:18px;height:18px;flex:none;opacity:.7}
#nav button[data-view].on{background:var(--panel);box-shadow:var(--sh);font-weight:700}
#runchip{margin-top:auto}
.runbox{background:var(--acc2);border-radius:10px;padding:10px;font-size:13px;cursor:pointer}
.runbox b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.runbox .t{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc)}
#nav #sidebtn{display:none}
#main{overflow:auto;padding:26px clamp(16px,3vw,40px) 80px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 16px;margin-bottom:18px}
.head h1{font-size:clamp(26px,3.4vw,36px);font-weight:800;letter-spacing:-.01em}
.head .sub{color:var(--mute);margin-top:4px;font-size:15px}
.dnav{display:flex;gap:4px}
.dnav button{min-width:38px;padding:6px 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--acc2);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.objs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.obj{border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px;background:var(--panel)}
.obj.done{text-decoration:line-through;color:var(--mute)}
.load{margin:4px 0 16px}
.lbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;display:flex}
.lbar i{display:block;height:100%}
.lbar .m{background:var(--evi);opacity:.55}.lbar .t{background:var(--acc)}
.load.over .lbar .t{background:var(--warn)}
.ltxt{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-top:5px;flex-wrap:wrap}
.load.over .ltxt span:last-child{color:var(--warn);font-weight:600}
form.add{margin-bottom:10px}
form.add input{background:var(--panel);border-style:dashed}
.list{display:flex;flex-direction:column;gap:7px;min-height:60px;border-radius:12px;padding:2px}
.list.over,.tlin.over,.wcol .list.over{background:var(--acc2)}
.card{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:10px 12px;box-shadow:var(--sh);cursor:grab}
.card.dragging{opacity:.4}
.card.done{opacity:.6}
.card.done .ctitle{text-decoration:line-through}
.card.running{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.chk{width:22px;height:22px;min-height:22px;padding:0;border-radius:50%;border:1.5px solid var(--mute);flex:none;margin-top:1px;font-size:13px;line-height:1;color:#fff}
.card.done .chk{background:var(--ok);border-color:var(--ok)}
.cbody{flex:1;cursor:pointer}
.prio{color:var(--acc);font-weight:800;margin-right:5px}.prio.u{color:var(--warn)}
.ctitle{font-weight:600;overflow-wrap:anywhere}
.cmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px;font-size:12.5px;color:var(--mute);align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.src{font-size:11.5px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
.ctime{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.play{width:30px;height:30px;min-height:30px;padding:0;border-radius:50%;font-size:11px}
.card:not(:hover) .play{opacity:.45}
.empty{color:var(--mute);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:12px}
.foot{color:var(--mute);font-size:13px;margin-top:12px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:16px;white-space:pre-wrap}
/* semaine */
.week{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:10px;overflow-x:auto;padding-bottom:10px}
.wcol{background:var(--panel2);border-radius:13px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px}
.wcol.today{box-shadow:inset 0 0 0 2px var(--acc)}
.wcol h3{font-size:15px;display:flex;justify-content:space-between;gap:6px;cursor:pointer}
.wcol h3 small{font-weight:500}
.wcol .card{padding:8px 9px;gap:8px}
.wcol .ctime{display:none}
.wcol form input{min-height:34px;font-size:14px;padding:5px 9px}
/* backlog */
.group{margin-bottom:22px}
.group h3{font-size:15px;margin-bottom:8px}
/* panneau latéral */
#side{border-left:1px solid var(--line);display:flex;flex-direction:column;background:var(--panel);min-height:0}
.stabs{display:flex;gap:4px;padding:12px 12px 8px;border-bottom:1px solid var(--line);align-items:center}
.stabs button{border:0;background:transparent;font-weight:600;color:var(--mute)}
.stabs button.on{color:var(--ink);background:var(--panel2)}
#sidebody{flex:1;overflow:auto;min-height:0;position:relative}
.sinfo{padding:18px;color:var(--mute);font-size:14px;display:flex;flex-direction:column;gap:10px}
.sinfo b{color:var(--ink)}
.calhead{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:700;position:sticky;top:0;background:var(--panel);z-index:3;border-bottom:1px solid var(--line)}
.allday{padding:6px 14px;display:flex;flex-direction:column;gap:4px;border-bottom:1px solid var(--line)}
.allday a{font-size:12.5px;background:var(--ev);color:var(--evi);border-radius:6px;padding:2px 8px;text-decoration:none}
.tl{position:relative;padding:8px 10px 20px 52px}
.tlin{position:relative;border-radius:8px}
.hr{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.hr span{position:absolute;left:-46px;top:-9px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.work{position:absolute;left:0;right:0;background:var(--acc2);opacity:.35;pointer-events:none}
.ev,.blk{position:absolute;border-radius:7px;padding:3px 7px;font-size:12.5px;overflow:hidden;line-height:1.25;text-decoration:none}
.ev{background:var(--ev);color:var(--evi);border-left:3px solid var(--evi)}
.blk{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--c,var(--acc));box-shadow:var(--sh);cursor:grab;color:var(--ink)}
.blk.done{opacity:.55;text-decoration:line-through}
.ev b,.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev small,.blk small{font-size:11px}
.short{display:flex;gap:6px;align-items:center;padding-top:1px;padding-bottom:1px}.short b{flex:1;order:2}.short small{order:1;flex:none}
.now{position:absolute;left:-6px;right:0;border-top:2px solid var(--warn);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.ghostline{position:absolute;left:0;right:0;height:3px;background:var(--acc);border-radius:2px;pointer-events:none;z-index:4}
.todo-item{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);cursor:grab;font-size:14px}
.todo-item span{flex:1;overflow-wrap:anywhere}
.todo-item.imp span{color:var(--mute)}
.todo-item .hi{color:var(--warn);font-weight:800}
.todo-top{padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--acc2);border-radius:10px;padding:8px 12px;font-size:13px;margin:10px 14px}
/* modale */
.modal{position:fixed;inset:0;background:rgba(15,17,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px 14px;z-index:50;overflow:auto}
.sheet{background:var(--panel);border-radius:16px;width:min(640px,100%);padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.mhead{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.mtitle{font-size:20px;font-weight:700;border-color:transparent;padding-left:4px}
.mtitle:hover{border-color:var(--line)}
.x{border:0;background:transparent;font-size:22px;min-width:38px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute);font-weight:500}
label.full{margin-top:12px}
.subs{margin-top:16px}
.subs h4{font-size:13px;color:var(--mute);font-weight:500;margin-bottom:6px}
.sub{display:flex;align-items:center;gap:8px;padding:4px 0}
.sub .chk{width:18px;height:18px;min-height:18px;font-size:10px}
.sub.d span{text-decoration:line-through;color:var(--mute)}
.sub span{flex:1}
.sub .x{font-size:16px;min-height:28px;min-width:28px}
.sub.d .chk{background:var(--ok);border-color:var(--ok)}
.subs form input{min-height:34px;font-size:14px;margin-top:4px}
.mfoot{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:20px}
/* rituels */
.rsteps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.rsteps span{font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--panel2);color:var(--mute)}
.rsteps span.on{background:var(--acc);color:#fff;font-weight:600}
.rsteps span.past{color:var(--ink)}
.rit h2{font-size:24px;font-weight:800;margin-bottom:6px}
.lead{color:var(--mute);margin:0 0 14px}
.rlist{display:flex;flex-direction:column;gap:6px;margin:10px 0;max-height:46vh;overflow:auto}
.rrow{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.rrow small{display:block}
.rrow .btns{display:flex;gap:5px;flex-wrap:wrap}
.rrow.sel{border-color:var(--acc);background:var(--acc2)}
.durs{display:flex;gap:4px;flex-wrap:wrap}
.durs button{min-width:46px}
.durs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rsec{font-size:13px;color:var(--mute);font-weight:600;margin:16px 0 4px}
.stat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.stat div{background:var(--panel2);border-radius:12px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat small{font-size:12.5px}
.bars{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.brow{display:grid;grid-template-columns:100px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.brow .bt{height:10px;background:var(--panel2);border-radius:99px;overflow:hidden}
.brow .bt i{display:block;height:100%;background:var(--c)}
.brow span:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* focus */
.focus{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;display:flex;justify-content:center;padding:5vh 18px}
.fwrap{width:min(620px,100%);display:flex;flex-direction:column;gap:16px}
.ftop{display:flex;align-items:center;gap:10px}
.ftop .x{margin-left:auto;font-size:14px}
.ftitle{font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.01em}
.fclock{font-size:clamp(56px,12vw,96px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--acc)}
.fsub{color:var(--mute)}
.fbtns{display:flex;flex-wrap:wrap;gap:10px}
.pomo{background:var(--acc2);border-radius:12px;padding:12px 16px;font-weight:600}
.fnotes{min-height:110px}
/* réglages */
.set{max-width:720px;display:flex;flex-direction:column;gap:24px}
.set section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.set h2{font-size:18px;margin-bottom:4px}
.set p{margin:4px 0 12px;color:var(--mute);font-size:14px}
.set .grid2{margin-top:8px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--mute)}
.status.on::before{background:var(--ok)}
.chrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:6px}
.chrow input[type=color]{padding:2px;height:40px}
code{background:var(--panel2);padding:2px 6px;border-radius:5px;font-size:13px;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font:600 12.5px Figtree,sans-serif}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:80;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%)}
/* assistant Claude */
.chat{display:flex;flex-direction:column;gap:10px;padding:14px}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:var(--acc2);align-self:flex-end;max-width:88%}
.msg.a{background:var(--panel2);max-width:100%}
.prop{display:flex;flex-direction:column;gap:6px;margin-top:8px;white-space:normal}
.pitem{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 9px;font-size:13px}
.pitem div{flex:1}.pitem small{display:block}
.pitem.ok{opacity:.55}
.aibar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-top:1px solid var(--line)}
.aibar button{font-size:12.5px;min-height:30px;padding:3px 10px;border-radius:99px}
.aiform{display:flex;gap:6px;padding:0 14px 14px}
.aiform button{flex:none}
.aiform textarea{min-height:42px;max-height:140px;font-size:15px}
.aisug{display:inline-flex;align-items:center;gap:4px;background:var(--acc2);color:var(--ink);border-radius:6px;padding:0 0 0 6px;font-size:12px}
.aisug button{min-height:22px;height:22px;padding:0 6px;border:0;background:transparent;font-size:12px}
.badge{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--acc);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:4px;padding:0 4px}
.thinking{color:var(--mute);font-size:13px;padding:0 14px 10px}
@media (max-width:1100px){
 #app{grid-template-columns:196px minmax(0,1fr)}
 #side{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:40;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
 body.side-open #side{transform:none}
 #nav #sidebtn{display:flex}
 .stabs .closeside{display:block}
}
.stabs .closeside{display:none;margin-left:auto}
@media (max-width:720px){
 #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
 #nav{grid-row:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:6px;gap:2px;overflow-x:auto}
 .brand,#runchip .runbox span{display:none}
 #nav button[data-view]{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;flex:1;align-items:center}
 #runchip{margin:0}
 .runbox{padding:6px 8px}
 #main{padding:18px 14px 30px}
 .grid2{grid-template-columns:minmax(0,1fr)}
 .stat{grid-template-columns:minmax(0,1fr)}
 .acts{margin-left:0}
 .brow{grid-template-columns:80px minmax(0,1fr) 60px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
 <nav id="nav">
  <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#e8590c"/><path d="M7 21a9 9 0 0 1 18 0" fill="#fff"/><rect x="5" y="22.5" width="22" height="2.4" rx="1.2" fill="#fff"/></svg>Journée</div>
  <button data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</button>
  <button data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Semaine</button>
  <button data-view="backlog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Backlog</button>
  <button data-view="objectives"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Objectifs</button>

function parseQuick(txt){
 let est=0,channel=null;
 txt=(' '+txt+' ').replace(/\s~?(\d{1,2})\s?h\s?(\d{1,2})?(?=\s)/i,(m,h,mm)=>{est=+h*60+(+mm||0);return ' '})
  .replace(/\s~?(\d{1,3})\s?(?:m|min|mn)(?=\s)/i,(m,n)=>{est=+n;return ' '})
  .replace(/\s#(\S+)/,(m,n)=>{const c=S.channels.find(c=>c.name.toLowerCase().startsWith(n.toLowerCase()));if(c){channel=c.id;return ' '}return m});
 return {title:txt.trim().replace(/\s+/g,' '),est,channel};
}
function addTask(text,day){

 S.tasks.push(t);save();render();aiWatch(t);emit('task:add',{task:t});return t;
}
async function toggleDone(id){

  catch(e){toast('To Do : '+e.message)}
 }

}

/* ---------- récurrence ---------- */
const RULES={daily:'Tous les jours',weekdays:'Jours ouvrés (lun–ven)',weekly:'Chaque semaine',monthly:'Chaque mois'};
function matches(r,day){const d=parseYmd(day),w=d.getDay();switch(r.rule){case'daily':return true;case'weekdays':return w>0&&w<6;case'weekly':return w===r.dow;case'monthly':return d.getDate()===r.dom}return false}
function genRecurring(){
 const t0=today();let changed=false;
 for(let i=0;i<7;i++){const day=addDays(t0,i);
  for(const r of S.recurring){
   if(day<r.from||(r.skip||[]).includes(day)||!matches(r,day))continue;
   if(S.tasks.some(t=>t.recurId===r.id&&t.day===day))continue;
   S.tasks.push(mk({title:r.title,channel:r.channel,est:r.est,notes:r.notes||'',day,recurId:r.id,order:nextOrder(day),subtasks:(r.subs||[]).map(x=>({id:uid(),t:x,d:false}))}));changed=true;
  }}
 if(changed)save();
}
function setRecur(t,rule){
 let r=t.recurId&&S.recurring.find(x=>x.id===t.recurId);
 if(!rule){
  if(r){S.recurring=S.recurring.filter(x=>x!==r);S.tasks=S.tasks.filter(x=>!(x.recurId===r.id&&x!==t&&!x.done&&x.day&&x.day>(t.day||today())))}
  t.recurId=null;return;
 }
 if(!t.day)t.day=today();
 if(!r){r={id:uid(),title:t.title,channel:t.channel,est:t.est,notes:t.notes,subs:t.subtasks.map(s=>s.t),from:t.day,skip:[]};S.recurring.push(r);t.recurId=r.id}
 const b=parseYmd(t.day);r.rule=rule;r.dow=b.getDay();r.dom=b.getDate();
 S.tasks=S.tasks.filter(x=>!(x.recurId===r.id&&x!==t&&!x.done&&x.day>t.day&&!matches(r,x.day)));
 genRecurring();
}

/* ---------- Google Agenda (OAuth implicite, côté navigateur) ---------- */
const REDIRECT=location.origin+location.pathname;

function gTok(){try{const o=JSON.parse(lsGet('journee.g')||'null');return o&&o.exp>Date.now()+30000?o.t:null}catch(e){return null}}

function gLogin(){
 if(!S.settings.googleClientId){toast('Ajoute d’abord ton identifiant client Google dans Réglages');go('settings');return}
 const p=new URLSearchParams({client_id:S.settings.googleClientId.trim(),redirect_uri:REDIRECT,response_type:'token',scope:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata',include_granted_scopes:'true',state:'g'});
 location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p;
}
function gLogout(){lsDel('journee.g');lsDel('journee.g.on');gEvents={};render()}
async function gFetch(path,opts={}){
 const t=gTok();if(!t)throw new Error('session expirée, reconnecte Google');
 const r=await fetch('https://www.googleapis.com/calendar/v3'+path,{...opts,headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'}});
 if(r.status===401){lsDel('journee.g');throw new Error('session expirée, reconnecte Google')}
 if(r.status===204)return null;
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.error&&j.error.message)||('erreur '+r.status));return j;
}
async function ensureRange(from,to,force){
 if(!gTok())return;
 const days=[];for(let d=from;d<=to;d=addDays(d,1))days.push(d);
 if(!force&&days.every(d=>gEvents[d]))return;
 const k=from+to;if(gLoading[k])return;gLoading[k]=1;
 try{
  const tMin=parseYmd(from).toISOString(),tMax=parseYmd(addDays(to,1)).toISOString();let items=[],page='';
  do{const j=await gFetch(`/calendars/${calId()}/events?singleEvents=true&orderBy=startTime&maxResults=250&timeMin=${encodeURIComponent(tMin)}&timeMax=${encodeURIComponent(tMax)}${page?'&pageToken='+encodeURIComponent(page):''}`);items=items.concat(j.items||[]);page=j.nextPageToken}while(page);
  days.forEach(d=>gEvents[d]=[]);
  for(const e of items){
   if(e.status==='cancelled'||!e.start)continue;
   if(e.attendees&&e.attendees.some(a=>a.self&&a.responseStatus==='declined'))continue;
   if(e.start.dateTime){const sd=ymd(new Date(e.start.dateTime));if(gEvents[sd])gEvents[sd].push(e)}
   else if(e.start.date){for(let x=e.start.date;x<(e.end&&e.end.date||addDays(e.start.date,1));x=addDays(x,1))if(gEvents[x])gEvents[x].push(e)}
  }
 }catch(e){days.forEach(d=>gEvents[d]=gEvents[d]||[]);toast('Google Agenda : '+e.message)}
 finally{delete gLoading[k];render()}
}
const isMine=e=>!!(e.extendedProperties&&e.extendedProperties.private&&e.extendedProperties.private.journeeTask);
const timedEvents=d=>(gEvents[d]||[]).filter(e=>e.start.dateTime&&!isMine(e));
function meetingMin(d){return timedEvents(d).filter(e=>e.transparency!=='transparent').reduce((a,e)=>a+Math.max(0,(new Date(e.end.dateTime)-new Date(e.start.dateTime))/60000),0)}
const evBody=t=>({summary:(t.done?'✓ ':'')+t.title,description:(t.notes?t.notes+'\n\n':'')+'Planifié avec Journée',start:{dateTime:t.block.start},end:{dateTime:t.block.end},extendedProperties:{private:{journeeTask:t.id}}});
async function setBlock(t,start,noRender){
 if(!t.est)t.est=30;
 const end=new Date(start.getTime()+t.est*60000);
 t.block={start:start.toISOString(),end:end.toISOString(),gcalId:t.block&&t.block.gcalId||null,title:t.title};
 t.day=ymd(start);save();if(!noRender)render();
 if(gTok()){
  try{
   if(t.block.gcalId)await gFetch(`/calendars/${calId()}/events/${encodeURIComponent(t.block.gcalId)}`,{method:'PATCH',body:JSON.stringify(evBody(t))});
   else{const ev=await gFetch(`/calendars/${calId()}/events`,{method:'POST',body:JSON.stringify(evBody(t))});if(t.block)t.block.gcalId=ev.id}
   save();
  }catch(e){toast('Google Agenda : '+e.message)}
 }
}
function clearBlock(t,noRender){
 const id=t.block&&t.block.gcalId;t.block=null;save();
 if(id&&gTok())gFetch(`/calendars/${calId()}/events/${encodeURIComponent(id)}`,{method:'DELETE'}).catch(()=>{});
 if(!noRender)render();
}
function autoBox(d){
 const s=S.settings,base=parseYmd(d);
 let from=s.workStart*60;
 if(d===today()){const n=new Date();from=Math.max(from,Math.ceil((n.getHours()*60+n.getMinutes())/15)*15)}
 const end=s.workEnd*60;
 const busy=timedEvents(d).filter(e=>e.transparency!=='transparent').map(e=>{const a=new Date(e.start.dateTime),b=new Date(e.end.dateTime);return[a.getHours()*60+a.getMinutes(),b.getHours()*60+b.getMinutes()+(ymd(b)!==d?1440:0)]});
 S.tasks.filter(t=>t.block&&ymd(new Date(t.block.start))===d).forEach(t=>{const a=new Date(t.block.start),b=new Date(t.block.end);busy.push([a.getHours()*60+a.getMinutes(),b.getHours()*60+b.getMinutes()])});
 let n=0;
 for(const t of dayTasks(d).filter(t=>!t.done&&!t.block)){
  const dur=t.est||30;let st=from;
  for(let guard=0;guard<200;guard++){const hit=busy.find(([a,b])=>st<b&&st+dur>a);if(!hit)break;st=Math.ceil(hit[1]/5)*5}
  if(st+dur>end)continue;
  const dt=new Date(base);dt.setMinutes(st);setBlock(t,dt,true);busy.push([st,st+dur]);n++;
 }
 render();return n;
}

/* ---------- synchro entre appareils (dossier caché de l'appli dans Google Drive) ---------- */
let syncBusy=false,syncState='';
async function dfetch(url,opts={}){
 const t=gTok();if(!t)throw new Error('Google non connecté');
 const r=await fetch(url,{...opts,headers:{Authorization:'Bearer '+t,...(opts.headers||{})}});
 if(r.status===401){lsDel('journee.g');throw new Error('session expirée')}
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error((j.error&&j.error.message)||('erreur '+r.status))}
 return r;
}
async function driveSync(){
 if(!gTok()||syncBusy)return;syncBusy=true;
 try{
  const q=encodeURIComponent("name='journee.json'");
  const list=await (await dfetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime)`)).json();
  const f=list.files&&list.files[0];
  const local=()=>{const c=Object.assign({},S);delete c.running;c.settings=Object.assign({},S.settings,{aiKey:''});return JSON.stringify(c)};
  if(f){
   const remote=await (await dfetch(`https://www.googleapis.com/drive/v3/files/${f.id}?alt=media`)).json();
   const rU=remote.updatedAt||0,lU=S.updatedAt||0;
   if(!S.syncedAt||rU>lU){
    const run=S.running,key=S.settings.aiKey;S=Object.assign(defaults(),remote);S.settings=Object.assign(defaults().settings,remote.settings||{},{aiKey:key});S.running=run;S.syncedAt=Date.now();
    lsSet(KEY,JSON.stringify(S));genRecurring();render();syncState='Synchronisé';
   }else if(lU>rU||!S.syncedAt){
    await dfetch(`https://www.googleapis.com/upload/drive/v3/files/${f.id}?uploadType=media`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:local()});
    S.syncedAt=Date.now();lsSet(KEY,JSON.stringify(S));syncState='Synchronisé';
   }
  }else{
   const b='journee'+Date.now(),meta=JSON.stringify({name:'journee.json',parents:['appDataFolder']});
   await dfetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body:`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${local()}\r\n--${b}--`});
   S.syncedAt=Date.now();lsSet(KEY,JSON.stringify(S));syncState='Synchronisé';
  }
 }catch(e){syncState='Synchro en échec : '+e.message;if(/insufficient|scope|permission/i.test(e.message))syncState='Reconnecte Google pour activer la synchro'}
 finally{syncBusy=false;const el=document.querySelector('[data-live="sync"]');if(el)el.textContent=syncState}
}

/* ---------- Microsoft To Do (OAuth PKCE + Microsoft Graph) ---------- */
const MS='https://login.microsoftonline.com/common/oauth2/v2.0';
const MS_SCOPE='openid offline_access User.Read Tasks.ReadWrite';
const msOn=()=>!!lsGet('journee.m');
const b64url=b=>btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
async function msLogin(){
 if(!S.settings.msClientId){toast('Ajoute d’abord ton identifiant d’application Microsoft dans Réglages');go('settings');return}
 if(!window.crypto||!crypto.subtle){toast('Il faut ouvrir l’appli en https (ou sur localhost) pour se connecter');return}
 const v=b64url(crypto.getRandomValues(new Uint8Array(32)));lsSet('journee.m.v',v);
 const c=b64url(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v))));

const AI_SYS=`Tu es Claude, l'assistant de planification intégré à l'appli « Journée » (équivalent de Sunsama). Tu aides l'utilisateur à organiser son temps : ordre des tâches, catégorie (canal), durée réaliste, répartition dans la semaine, et nouvelles tâches utiles (préparer une réunion, un suivi, une étape vers un objectif de la semaine).

function parseCSV(txt){
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else if(c!=='\r')f+=c}
 if(f||row.length){row.push(f);rows.push(row)}
 const h=rows.shift().map(x=>x.replace(/^﻿/,''));return rows.filter(r=>r.length>1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]||''])));
}
const htmlText=h=>{if(!h)return'';const x=h.replace(/<li>/g,'<li>- ').replace(/<\/(p|li|h\d)>|<br\s*\/?>/g,'\n');return strip(x).replace(/\n{3,}/g,'\n\n').trim()};
const jparse=(v,d)=>{try{return JSON.parse(v)}catch(e){return d}};
function importSunsama(txt){
 const rows=parseCSV(txt);if(!rows.length||!('sequenceRule' in rows[0]))throw new Error('ce fichier ne ressemble pas à un export Sunsama');
 const t0=today(),stale=addDays(t0,-30),RIT=/^(daily planning|daily shutdown|weekly planning|weekly review)$/i;
 const CTX={Perso:'#2f9e6a',Pro:'#3b6fd8',Art:'#9b4dca','Déménagement':'#c99a06'};
 const shade=(hex,i)=>{const n=parseInt(hex.slice(1),16),k=(i%4)*18-18,cl=v=>Math.max(0,Math.min(255,v+k));return '#'+[n>>16,(n>>8)&255,n&255].map(v=>cl(v).toString(16).padStart(2,'0')).join('')};
 const st={tasks:0,archive:0,channels:0,objectives:0,recurring:0,skipped:0,dup:0};
 S.tasks=S.tasks.filter(t=>!/^Exemple : /.test(t.title));
 const chIdx={},perCtx={};
 for(const r of rows){const name=(r.channel||'').replace(/^#/,'').trim();if(!name||chIdx[name])continue;const ctx=(r.context||'').replace(/^#/,'').trim();
  let c=S.channels.find(x=>x.name.toLowerCase()===name.toLowerCase());perCtx[ctx]=(perCtx[ctx]||0)+1;
  if(!c){c={id:'sun-c-'+name.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'-'),name,color:shade(CTX[ctx]||'#8a8f98',perCtx[ctx])};S.channels.push(c);st.channels++}
  c.ctx=ctx;chIdx[name]=c.id}
 S.channels=S.channels.filter(c=>!(['c1','c3'].includes(c.id)&&!S.tasks.some(t=>t.channel===c.id)));
 const rec={},recMap={};
 for(const r of rows){if(!r.sequenceRule)continue;const k=r.text+'|'+r.sequenceRule;(rec[k]=rec[k]||[]).push(r)}
 const DAYS=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
 for(const [k,list] of Object.entries(rec)){const last=list.map(r=>r.startDate).filter(Boolean).sort().pop();if(!last||last<addDays(t0,-60))continue;
  const r0=list[0],rule=r0.sequenceRule;const tpl={id:'sun-r-'+r0.id,title:r0.text,channel:chIdx[(r0.channel||'').replace(/^#/,'')]||null,est:+r0.timeEstimate||0,notes:'',subs:[],from:addDays(last,1),skip:[]};
  let m;
  if(/every day/.test(rule))tpl.rule='daily';else if((m=rule.match(/every week on (\w+)/i))){tpl.rule='weekly';tpl.dow=DAYS.indexOf(m[1].toLowerCase())}else if((m=rule.match(/every month on the (\d+)/))){tpl.rule='monthly';tpl.dom=+m[1]}else continue;
  if(!S.recurring.some(x=>x.id===tpl.id)){S.recurring.push(tpl);st.recurring++}recMap[k]=tpl.id}
 const objMap={};S.archive=S.archive||[];
 const have=new Set(S.tasks.map(t=>t.id)),haveA=new Set(S.archive.map(a=>a.id));
 for(const r of rows){
  const id='sun-'+r.id;if(have.has(id)||haveA.has(id)){st.dup++;continue}
  if(!r.text||RIT.test(r.text.trim())){st.skipped++;continue}
  const done=!!r.completedDate;let day=r.startDate||null;const chId=chIdx[(r.channel||'').replace(/^#/,'')]||null;
  const actual=+r.actualTimeSeconds||0,est=+r.timeEstimate||0;
  if(done&&day&&day<stale){const a={id,t:r.text,c:chId,d:day,e:est,a:actual};if(r.objective)a.o=r.objective;S.archive.push(a);st.archive++;continue}
  if(!done&&day&&day<stale)day=null;
  const subs=jparse(r.subtasks,[]).map(x=>({id:uid(),t:x.title||'',d:!!x.completedDate})).filter(x=>x.t);
  const t=mk({id,title:r.text,notes:htmlText(r.notes),channel:chId,est,actual,day,done,doneAt:done?Date.parse(r.completedDate):null,subtasks:subs,order:r.createdAt?Date.parse(r.createdAt)/1e12:0,
   prio:{Urgent:'urgent',Priority:'high','Low Priority':'low'}[r.latestDailyPriority]||'',recurId:recMap[r.text+'|'+r.sequenceRule]||null});
  const sch=jparse(r.scheduledTime,[])[0];if(!done&&day&&day>=t0&&sch&&sch.startDate&&sch.endDate)t.block={start:sch.startDate,end:sch.endDate,gcalId:null,title:t.title};
  if(r.objective&&day&&day>=stale){const w=monday(day),k=w+'|'+r.objective;if(!objMap[k]){let o=S.objectives.find(o=>o.week===w&&o.title===r.objective);if(!o){o={id:'sun-o-'+uid(),week:w,title:r.objective,done:false};S.objectives.push(o);st.objectives++}objMap[k]=o}t.objId=objMap[k].id}
  S.tasks.push(t);st.tasks++;
 }
 for(const o of Object.values(objMap)){const lt=S.tasks.filter(t=>t.objId===o.id);if(lt.length&&lt.every(t=>t.done))o.done=true}
 for(const d of new Set(S.tasks.filter(t=>t.day).map(t=>t.day)))renorm(d);
 genRecurring();save();render();emit('import:sunsama',st);return st;
}

 <button class="chk" data-act="toggle" data-id="${t.id}" aria-label="${t.done?'Rouvrir':'Terminer'}">${t.done?'✓':''}</button>
 <div class="cbody" data-act="open" data-id="${t.id}"><div class="ctitle">${t.prio==='urgent'?'<span class="prio u" title="Urgent">!!</span>':t.prio==='high'?'<span class="prio" title="Prioritaire">!</span>':''}${esc(t.title)}</div>
 <div class="cmeta">${c?`<span class="chip" style="--c:${esc(c.color)}">${esc(c.name)}</span>`:''}${t.block?`<span>${hm(new Date(t.block.start))}</span>`:''}${t.src?'<span class="src">To Do</span>':''}${t.recurId?'<span title="Récurrente">↻</span>':''}${subs}${t.aiSug&&!t.done?`<span class="aisug">Claude : ${esc([t.aiSug.channel&&ch(t.aiSug.channel)?ch(t.aiSug.channel).name:'',t.aiSug.est?fmtMin(t.aiSug.est):''].filter(Boolean).join(' · '))}<button data-act="aiok" data-id="${t.id}" aria-label="Accepter la suggestion">✓</button><button data-act="aino" data-id="${t.id}" aria-label="Refuser la suggestion">✕</button></span>`:''}</div></div>
 <div class="ctime"><span data-live="t-${t.id}" title="Temps passé / estimé">${act>=60||run?fmtMin(act/60)+' / ':''}${t.est?fmtMin(t.est):'—'}</span>${t.done?'':`<button class="play" data-act="play" data-id="${t.id}" aria-label="Démarrer le focus">▶</button>`}</div></div>`;
}
function loadInfo(d){const ts=dayTasks(d);const task=ts.reduce((a,t)=>a+(t.est||0),0),meet=meetingMin(d),cap=Math.max(60,(S.settings.workEnd-S.settings.workStart)*60);return{task,meet,cap,over:task+meet-cap}}
function loadBar(d){
 const L=loadInfo(d),p=v=>Math.min(100,v/L.cap*100);
 return `<div class="load${L.over>0?' over':''}"><div class="lbar"><i class="m" style="width:${p(L.meet)}%"></i><i class="t" style="width:${Math.max(0,Math.min(100-p(L.meet),p(L.task)))}%"></i></div>
 <div class="ltxt"><span>${fmtMin(L.task)} de tâches${L.meet?' · '+fmtMin(L.meet)+' de réunions':''} sur ${fmtMin(L.cap)} de travail</span><span>${L.over>0?fmtMin(L.over)+' de trop':fmtMin(-L.over)+' de marge'}</span></div></div>`;

const addForm=(day,ph,keep)=>`<form class="add" data-form="add" data-day="${day||''}"><input name="t" data-keep="${keep||'add-'+(day||'backlog')}" placeholder="${esc(ph)}" autocomplete="off" aria-label="Nouvelle tâche"></form>`;

/* ---------- panneau latéral : agenda ---------- */
const PX=56;
function viewCal(){
 const d=cur,s=S.settings,st=s.dayStart,en=Math.max(s.dayEnd,st+1),H=(en-st)*PX;
 const ev=gEvents[d]||[],allday=ev.filter(e=>e.start.date),timed=timedEvents(d);
 const blocks=S.tasks.filter(t=>t.block&&ymd(new Date(t.block.start))===d);
 const items=[...timed.map(e=>({k:'ev',s:new Date(e.start.dateTime),e:new Date(e.end.dateTime),e0:e})),...blocks.map(t=>({k:'b',s:new Date(t.block.start),e:new Date(t.block.end),t}))].sort((a,b)=>a.s-b.s||b.e-a.e);
 // colonnes pour les chevauchements
 let cl=[],cend=0;const out=[];
 const flush=()=>{const cols=[];cl.forEach(it=>{let c=cols.findIndex(e=>e<=it.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=it.e;it.col=c});cl.forEach(it=>it.n=cols.length);out.push(...cl);cl=[]};
 items.forEach(it=>{if(cl.length&&it.s>=cend)flush();cl.push(it);cend=Math.max(cend,+it.e)});flush();
 const y=dt=>((dt.getHours()-st)*60+dt.getMinutes()+(ymd(dt)!==d?(dt>parseYmd(d)?1440:-1440):0))/60*PX;
 const hrs=[...Array(en-st+1)].map((_,i)=>`<div class="hr" style="top:${i*PX}px"><span>${pad(st+i)}:00</span></div>`).join('');
 const blocksHtml=out.map(it=>{
  const top=Math.max(0,y(it.s)),h=Math.max(20,Math.min(H,y(it.e))-top),w=100/it.n,l=it.col*w;
  const pos=`top:${top}px;height:${h}px;left:calc(${l}% + 2px);width:calc(${w}% - 4px)`,sh=h<36?' short':'';
  if(it.k==='ev'){const e=it.e0;return `<a class="ev${sh}" style="${pos}" href="${esc(e.htmlLink||'#')}" target="_blank" rel="noopener"><b>${esc(e.summary||'(sans titre)')}</b><small>${hm(it.s)}${sh?'':'–'+hm(it.e)}</small></a>`}
  const t=it.t,c=ch(t.channel);return `<div class="blk${t.done?' done':''}${sh}" style="${pos};--c:${esc(c?c.color:'var(--acc)')}" draggable="true" data-drag="task|${t.id}" data-act="open" data-id="${t.id}"><b>${esc(t.title)}</b><small>${hm(it.s)}${sh?'':'–'+hm(it.e)}</small></div>`;
 }).join('');
 const n=new Date(),nowTop=d===today()?y(n):-1;
 const gState=gTok()?'':gWas()?`<div class="pill">Session Google expirée<button class="sm pri" data-act="gin">Reconnecter</button></div>`:`<div class="pill">Connecte Google Agenda pour voir tes rendez-vous<button class="sm" data-act="gin">Connecter</button></div>`;
 return `<div class="calhead"><span>${cap1(fmtDay(d,{weekday:'long',day:'numeric',month:'short'}))}</span><span class="sp"></span>${gTok()?'<button class="sm ghost" data-act="refresh">Actualiser</button>':''}</div>
 ${gState}
 ${allday.length?`<div class="allday">${allday.map(e=>`<a href="${esc(e.htmlLink||'#')}" target="_blank" rel="noopener">${esc(e.summary||'(sans titre)')}</a>`).join('')}</div>`:''}
 <div class="tl"><div class="tlin" data-drop="cal" style="height:${H}px">${hrs}

 el.innerHTML=`<div class="fwrap"><div class="ftop">${c?`<span class="chip" style="--c:${esc(c.color)}">${esc(c.name)}</span>`:''}<button class="x" data-act="focusclose">Quitter le focus (Échap)</button></div>
 <h1 class="ftitle">${esc(t.title)}</h1>
 <div><div class="fclock" data-live="focus">${clock(actualSec(t))}</div><div class="fsub">${t.est?'Estimé : '+fmtMin(t.est):'Pas d’estimation'}${run?'':' · en pause'}</div></div>
 <div class="fbtns"><button class="${run?'ghost':'pri'} big" data-act="timer" data-id="${t.id}">${run?'Pause':'Reprendre'}</button><button class="ghost big" data-act="pomo">${pomo?'Arrêter le Pomodoro':'Pomodoro '+S.settings.pomo+' min'}</button><button class="ok big" data-act="focusdone" data-id="${t.id}">Terminer la tâche</button></div>
 ${pomo?`<div class="pomo" data-live="pomo">${pomoTxt()}</div>`:''}
 <div class="subs"><h4>Sous-tâches</h4><div>${subsHtml(t)}</div><form data-form="sub" data-tid="${t.id}"><input name="t" data-keep="fsub" placeholder="Ajouter une sous-tâche" autocomplete="off"></form></div>
 <textarea class="fnotes" data-fnotes="${t.id}" placeholder="Notes…">${esc(t.notes)}</textarea></div>`;
}
const pomoLeft=()=>pomo?(pomo.phase==='work'?S.settings.pomo:S.settings.brk)*60-(Date.now()-pomo.start)/1000:0;
const pomoTxt=()=>pomo?(pomo.phase==='work'?'Concentration — encore ':'Pause — encore ')+clock(pomoLeft()):'';

/* ---------- boucle d'une seconde ---------- */
setInterval(()=>{
 const r=S.running,t=r&&T(r.taskId);
 if(t){const el=document.querySelector('[data-live="run"]');if(el)el.textContent=clock(actualSec(t));
  const f=document.querySelector('[data-live="focus"]');if(f&&focusOn===t.id)f.textContent=clock(actualSec(t));
  const c=document.querySelector(`[data-live="t-${t.id}"]`);if(c)c.textContent=fmtMin(actualSec(t)/60)+' / '+(t.est?fmtMin(t.est):'—');}
 if(pomo){if(pomoLeft()<=0){chime(pomo.phase==='work'?880:660);if(pomo.phase==='work'){pomo={phase:'break',start:Date.now()};stopTimer();toast('Pause ! Lève-toi quelques minutes.')}else{pomo={phase:'work',start:Date.now()};if(focusOn)startTimer(focusOn);toast('C’est reparti.')}renderFocus()}
  const p=document.querySelector('[data-live="pomo"]');if(p)p.textContent=pomoTxt()}
 const nl=document.querySelector('[data-live="now"]');if(nl){const n=new Date();nl.style.top=((n.getHours()-S.settings.dayStart)*60+n.getMinutes())/60*PX+'px'}
 if(today()!==lastDay){const was=lastDay;lastDay=today();if(cur===was)cur=lastDay;genRecurring();render()}
},1000);

/* ---------- interactions ---------- */
let toastT;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),3200)}
document.addEventListener('click',async e=>{
 const nv=e.target.closest('#nav [data-view]');if(nv){go(nv.dataset.view);return}
 const sd=e.target.closest('[data-side]');if(sd){sideTab=sd.dataset.side;renderSide();return}
 if(e.target.id==='modal'){closeModal();return}
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,id=b.dataset.id;
 switch(a){
  case'toggle':await toggleDone(id);if(ritual)renderRitual();break;
  case'open':if(!e.target.closest('.chk'))openTask(id);break;
  case'play':openFocus(id);break;
  case'openfocus':openFocus(id);break;
  case'focusnext':{const t=dayTasks(cur).find(t=>!t.done);t?openFocus(t.id):toast('Aucune tâche à faire ce jour-là');break}
  case'focusclose':focusOn=null;renderFocus();render();break;
  case'focusdone':{await toggleDone(id);pomo=null;const nx=dayTasks(cur).find(t=>!t.done);focusOn=null;renderFocus();toast(nx?'Bravo ! Prochaine : '+nx.title:'Bravo ! Tout est fait.');break}
  case'timer':S.running&&S.running.taskId===id?(stopTimer(),render()):startTimer(id);renderFocus();break;
  case'pomo':pomo=pomo?null:{phase:'work',start:Date.now()};if(pomo&&focusOn&&!S.running)startTimer(focusOn);renderFocus();break;
  case'prev':cur=addDays(cur,-1);render();break;
  case'next':cur=addDays(cur,1);render();break;
  case'prevw':cur=addDays(cur,-7);render();break;
  case'nextw':cur=addDays(cur,7);render();break;
  case'gotoday':cur=today();render();break;
  case'openday':cur=b.dataset.day;go('today');break;
  case'plan':startRitual('plan',cur);break;
  case'shutdown':startRitual('shutdown',cur);break;
  case'weekplan':startRitual('weekplan',cur);break;
  case'weekreview':startRitual('weekreview',cur);break;
  case'ritnext':ritNext();break;
  case'ritback':ritual.step--;renderRitual();break;
  case'ritauto':{const n=autoBox(ritual.day);toast(n?n+' tâche'+(n>1?'s':'')+' placée'+(n>1?'s':''):'Pas de créneau libre assez long dans tes heures de travail');renderRitual();break}
  case'ritunblock':{const t=T(id);if(t)clearBlock(t);renderRitual();break}
  case'autobox':{const n=autoBox(cur);toast(n?n+' tâche'+(n>1?'s':'')+' placée'+(n>1?'s':''):'Rien à placer, ou pas de créneau libre');break}
  case'close':closeModal();break;
  case'closeside':document.body.classList.remove('side-open');break;
  case'rollover':rolloverAll(today());toast('Tâches reportées à aujourd’hui');break;
  case'mv':moveTask(id,b.dataset.to);if(ritual)renderRitual();break;
  case'mvall':rolloverAll(b.dataset.to);renderRitual();break;
  case'mvday':dayTasks(ritual.day).filter(t=>!t.done).forEach(t=>moveTask(t.id,b.dataset.to,true));save();render();renderRitual();break;
  case'rm':deleteTask(id);render();if(ritual)renderRitual();break;
  case'dur':{const t=T(id);if(t){t.est=+b.dataset.v;if(t.block)setBlock(t,new Date(t.block.start),true);if(t.recurId){const r=S.recurring.find(x=>x.id===t.recurId);if(r)r.est=t.est}save();render();renderRitual()}break}
  case'totoday':moveTask(id,today());toast('Ajoutée à aujourd’hui');break;
  case'del':deleteTask(id);closeModal();toast('Tâche supprimée');break;
  case'unblock':{const t=T(modalTask);if(t){clearBlock(t);openTask(t.id)}break}
  case'pushtodo':{const t=T(id);if(t)pushTodo(t);break}
  case'subt':case'subd':{const t=T(b.dataset.tid);if(!t)break;if(a==='subt'){const s=t.subtasks.find(s=>s.id===b.dataset.s);if(s)s.d=!s.d}else t.subtasks=t.subtasks.filter(s=>s.id!==b.dataset.s);save();if(focusOn)renderFocus();if(modalTask===t.id)openTask(t.id);render();break}
  case'objtoggle':{const o=S.objectives.find(o=>o.id===id);if(o){o.done=!o.done;save();render();if(ritual)renderRitual()}break}
  case'objdel':S.objectives=S.objectives.filter(o=>o.id!==id);S.tasks.forEach(t=>{if(t.objId===id)t.objId=null});save();render();if(ritual)renderRitual();break;
  case'objcarry':{const o=S.objectives.find(o=>o.id===id);if(o){S.objectives.push({id:uid(),week:monday(ritual.day),title:o.title,done:false});save();renderRitual()}break}
  case'gin':gLogin();break;
  case'gout':gLogout();break;
  case'min':msLogin();break;
  case'mout':msLogout();break;
  case'refresh':{const w=monday(cur);gEvents={};view==='week'?ensureRange(w,addDays(w,6),true):ensureRange(cur,cur,true);break}
  case'goset':go('settings');document.body.classList.remove('side-open');break;
  case'todoreload':todo.lists=null;todo.tasks={};renderSide();syncTodo();break;
  case'todoadd':{const l=b.dataset.l,x=(todo.tasks[l]||[]).find(x=>x.id===b.dataset.t);if(x){importTodo(l,x,b.dataset.day||cur);render();if(ritual)renderRitual();toast('Ajoutée au '+fmtDay(b.dataset.day||cur,{weekday:'long',day:'numeric'}))}break}
  case'copyuri':try{await navigator.clipboard.writeText(REDIRECT);toast('Adresse copiée')}catch(err){toast('Copie impossible : sélectionne l’adresse à la main')}break;
  case'chadd':S.channels.push({id:uid(),name:'Nouveau canal',color:'#'+Math.floor(Math.random()*0xaaaaaa+0x222222).toString(16).padStart(6,'0')});save();render();break;
  case'chdel':S.channels=S.channels.filter(c=>c.id!==id);S.tasks.forEach(t=>{if(t.channel===id)t.channel=null});save();render();break;
  case'aiq':sideTab='ai';document.body.classList.add('side-open');aiAsk(b.dataset.q,true);break;
  case'aiapply':{const m=S.chat[+b.dataset.m];if(m)applyItem(m,b.dataset.k);break}
  case'aiapplyall':{const m=S.chat[+b.dataset.m];if(m)propItems(m.prop).forEach(it=>applyItem(m,it.k));toast('Propositions appliquées');break}
  case'aiok':{const t=T(id);if(t&&t.aiSug){if(t.aiSug.channel)t.channel=t.aiSug.channel;if(t.aiSug.est){t.est=t.aiSug.est;if(t.block)setBlock(t,new Date(t.block.start),true)}t.aiSug=null;save();render()}break}
  case'aino':{const t=T(id);if(t){t.aiSug=null;save();render()}break}
  case'aiclear':S.chat=[];save();renderSide();toast('Conversation effacée');break;
  case'askclaude':sideTab='ai';closeModal();document.body.classList.add('side-open');aiAsk('Aide-moi à planifier ma journée : ordre, durées, catégories, et ce qui doit être reporté.',true);break;
  case'export':{const blob=new Blob([JSON.stringify(Object.assign({},S,{settings:Object.assign({},S.settings,{aiKey:''})}),null,1)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='journee-'+today()+'.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);break}
 }
});
document.addEventListener('submit',e=>{
 const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 const inp=f.querySelector('input,textarea'),v=inp.value.trim();if(!v)return;
 const k=f.dataset.form;
 if(k==='add'){addTask(v,f.dataset.day||null);const n=document.querySelector(`[data-keep="${inp.dataset.keep}"]`);if(n)n.value='';if(ritual)renderRitual()}
 else if(k==='obj'){S.objectives.push({id:uid(),week:monday(ritual?ritual.day:cur),title:v,done:false});save();render();if(ritual)renderRitual()}
 else if(k==='ai'){inp.value='';aiAsk(v,false);return}
 else if(k==='sub'){const t=T(f.dataset.tid);if(t){t.subtasks.push({id:uid(),t:v,d:false});save();if(focusOn)renderFocus();if(modalTask===t.id)openTask(t.id);render()}}
 const n=document.querySelector(`[data-keep="${inp.dataset.keep}"]`);if(n){n.value='';n.focus()}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.f&&modalTask){const t=T(modalTask);if(!t)return;
  if(el.dataset.f==='title'){t.title=el.value;if(t.recurId){const r=S.recurring.find(x=>x.id===t.recurId);if(r)r.title=t.title}save()}
  if(el.dataset.f==='notes'){t.notes=el.value;save()}}
 if(el.dataset.fnotes){const t=T(el.dataset.fnotes);if(t){t.notes=el.value;save()}}
});
document.addEventListener('change',async e=>{
 const el=e.target,f=el.dataset.f;
 if(f&&modalTask){const t=T(modalTask);if(!t)return;const r=t.recurId&&S.recurring.find(x=>x.id===t.recurId);
  switch(f){
   case'channel':t.channel=el.value||null;if(r)r.channel=t.channel;break;
   case'est':t.est=+el.value;if(r)r.est=t.est;if(t.block)setBlock(t,new Date(t.block.start),true);break;
   case'day':{const nd=el.value||null;if(t.block&&ymd(new Date(t.block.start))!==nd)clearBlock(t,true);t.day=nd;if(nd)t.order=nextOrder(nd);break}
   case'time':if(el.value){const[hh,mm]=el.value.split(':').map(Number),dt=parseYmd(t.day||cur);dt.setHours(hh,mm,0,0);setBlock(t,dt,true)}else clearBlock(t,true);break;
   case'obj':t.objId=el.value||null;break;
   case'prio':t.prio=el.value;break;
   case'recur':setRecur(t,el.value);break;
   case'actual':if(S.running&&S.running.taskId===t.id)S.running.start=Date.now();t.actual=Math.max(0,+el.value||0)*60;break;
   default:return;
  }
  save();render();if(['day','time','recur','est'].includes(f))openTask(t.id);return;
 }
 if(el.dataset.ritime){const t=T(el.dataset.ritime);if(t){if(el.value){const[hh,mm]=el.value.split(':').map(Number),dt=parseYmd(ritual.day);dt.setHours(hh,mm,0,0);await setBlock(t,dt,true)}else clearBlock(t,true);render();renderRitual()}return}
 if(el.dataset.set){const k=el.dataset.set;S.settings[k]=k==='aiAuto'?!!el.value:el.type==='number'?+el.value:el.value.trim();save();if(el.type==='number'||k==='aiKey')render();return}
 if(el.dataset.chc){const c=ch(el.dataset.chc);if(c){c.color=el.value;save();render()}return}
 if(el.dataset.chn){const c=ch(el.dataset.chn);if(c){c.name=el.value.trim()||c.name;save()}return}
 if(el.hasAttribute('data-todolist')){todo.listId=el.value;S.settings.todoList=el.value;save();renderSide();return}
 if(el.hasAttribute('data-sunsama')&&el.files[0]){try{const st=importSunsama(await el.files[0].text());showModal(`<div class="rit"><h2>Import Sunsama terminé</h2><div class="stat"><div><b>${st.tasks}</b><small>tâches actives ou récentes</small></div><div><b>${st.archive}</b><small>tâches dans l’historique</small></div><div><b>${st.channels}</b><small>canaux créés</small></div></div><p class="lead">${st.objectives} objectifs, ${st.recurring} récurrence(s) active(s), ${st.skipped} rituels ignorés${st.dup?', '+st.dup+' déjà importées':''}.</p><div class="mfoot"><span class="sp"></span><button class="pri" data-act="close">Voir ma journée</button></div></div>`);view='today';cur=today();render()}catch(err){toast('Import impossible : '+err.message)}return}
 if(el.hasAttribute('data-import')&&el.files[0]){try{const j=JSON.parse(await el.files[0].text());if(!Array.isArray(j.tasks))throw new Error('format inconnu');S=Object.assign(defaults(),j);S.settings=Object.assign(defaults().settings,j.settings||{});save();render();toast('Sauvegarde importée')}catch(err){toast('Import impossible : '+err.message)}}
});

/* ---------- glisser-déposer ---------- */
function calMinute(z,y){const r=z.getBoundingClientRect();let m=S.settings.dayStart*60+(y-r.top)/PX*60;m=Math.round(m/15)*15;return Math.max(S.settings.dayStart*60,Math.min(S.settings.dayEnd*60-15,m))}
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-drag]');if(!c)return;drag=c.dataset.drag;try{e.dataTransfer.setData('text/plain',drag);e.dataTransfer.effectAllowed='move'}catch(err){}c.classList.add('dragging')});
document.addEventListener('dragend',()=>{document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));const g=$('#ghost');if(g)g.classList.add('hidden');drag=null});
document.addEventListener('dragover',e=>{
 const z=e.target.closest('[data-drop]');if(!z||!drag)return;e.preventDefault();
 document.querySelectorAll('.over').forEach(x=>{if(x!==z)x.classList.remove('over')});z.classList.add('over');
 const g=$('#ghost');if(g){if(z.dataset.drop==='cal'){g.classList.remove('hidden');g.style.top=(calMinute(z,e.clientY)-S.settings.dayStart*60)/60*PX+'px'}else g.classList.add('hidden')}
});
document.addEventListener('drop',async e=>{
 const z=e.target.closest('[data-drop]');if(!z||!drag)return;e.preventDefault();
 const dz=z.dataset.drop,src=drag.split('|');drag=null;z.classList.remove('over');
 let t;
 if(src[0]==='todo'){const x=(todo.tasks[src[1]]||[]).find(x=>x.id===src[2]);if(!x)return;t=importTodo(src[1],x,dz==='backlog'?null:dz.startsWith('day:')?dz.slice(4):cur)}
 else t=T(src[1]);
 if(!t)return;
 if(dz==='cal'){const dt=parseYmd(cur);dt.setMinutes(calMinute(z,e.clientY));await setBlock(t,dt);return}
 if(dz==='backlog'){if(t.day!==null)moveTask(t.id,'backlog');else render();return}
 if(dz.startsWith('day:')){
  const day=dz.slice(4),before=e.target.closest('.card');
  if(t.day!==day)moveTask(t.id,day,true);
  if(before&&before.dataset.id!==t.id){const b=T(before.dataset.id);if(b&&b.day===day){t.order=b.order-.5;renorm(day)}}
  save();render();
 }
});

/* ---------- clavier ---------- */
document.addEventListener('keydown',e=>{if(e.target.dataset&&e.target.dataset.keep==='ai'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(!$('#modal').classList.contains('hidden'))closeModal();else if(focusOn){focusOn=null;renderFocus();render()}else document.body.classList.remove('side-open');return}
 if(e.target.matches('input,textarea,select')||e.metaKey||e.ctrlKey||e.altKey||focusOn||!$('#modal').classList.contains('hidden'))return;
 const k=e.key.toLowerCase();
 if(k==='n'){e.preventDefault();const i=document.querySelector('[data-keep^="add-"]');if(i)i.focus()}
 else if(k==='t'){cur=today();go('today')}
 else if(k==='w')go('week');else if(k==='b')go('backlog');else if(k==='o')go('objectives');
 else if(k==='p')startRitual('plan',cur);else if(k==='s')startRitual('shutdown',cur);
 else if(k==='f'){const t=dayTasks(cur).find(t=>!t.done);if(t)openFocus(t.id)}
 else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const s=e.key==='ArrowLeft'?-1:1;cur=addDays(cur,(view==='week'||view==='objectives')?7*s:s);render()}
});

/* ---------- démarrage ---------- */
genRecurring();
render();
if(S.running&&T(S.running.taskId))renderRun();
if(msOn()&&S.settings.msClientId)setTimeout(syncTodo,1500);
setTimeout(driveSync,800);
setTimeout(aiMorning,1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){driveSync();if(msOn())syncTodo();if(gTok()){gEvents={};render()}}});
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
